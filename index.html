function caseInvestigationHTML(k){return '<div class="panel"><h3>🗂 Travaux complémentaires — dossier '+(k+1)+'</h3><p>Réponses guidées et justifications courtes, conservées dans le bilan pour le formateur (hors notation automatique).</p>'+caseInvestigations[k].map((p,i)=>{let key='E'+(k+1)+'-A'+(i+1);return '<div class="case-questions"><h4>'+esc((i+1)+'. '+p[0])+'</h4><p>'+esc(guidedCaseFields[key]?'Renseigne chaque grandeur, puis rédige une courte conclusion.':p[1])+'</p>'+caseGuidedFields(key)+'</div>'}).join('')+'</div>'}
function caseIntroHTML(k){let d=caseDetails[k];return `<div class="case-brief"><h3>📋 Dossier de mission · étude ${k+1}</h3><p>${esc(d.intro)}</p><b>Données de terrain et contraintes :</b><ul>${d.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="small muted">Livrable attendu : calculs, hypothèses, justificatifs et unités. Le résultat numérique ou le QCM seul ne constitue pas une étude de cas complète.</p></div>${drawingCase(k+1)}${caseInvestigationHTML(k)}`}

function reservePage(id){if(!teacherMode&&!state.missionResults[id])return header('ENTRAÎNEMENT BONUS','Mission non terminée','Valide la mission pour accéder à la réserve.');let m=missions[id-1];return header('QUESTIONS SUPPLÉMENTAIRES · MISSION '+id,m.name+' — Gagne tes indices','Seule une bonne réponse rapporte un jeton ; une seconde tentative est possible. Les scores de mission restent inchangés.')+hintWalletHTML()+`<div class="actions"><button class="btn alt" data-nav="m${id}">← Retour à la mission</button><button class="btn alt" data-nav="exam">Consulter l’étude de cas →</button></div><div class="bonus-summary">🎯 Objectif : réaliser les ${m.reserve.length} exercices supplémentaires de cette mission. Une bonne réponse donne 1 jeton. Deux essais possibles, aucun gain après deux erreurs.</div>`+m.reserve.map(q=>{let a=state.reserveAnswers[q.id],done=state.reserveAnswers['done-'+q.id]===true,ok=questionCorrect(q,a),tries=Number(state.reserveAnswers['tries-'+q.id]||0),locked=done||tries>=2;return `<div class="question"><div class="number">${esc(q.id)} · QUESTION SUPPLÉMENTAIRE · ${done&&ok?'🔓 JETON GAGNÉ':locked?'AUCUN JETON':'JETON À GAGNER'}</div><h3>${esc(q.t)}</h3><p>${esc(q.p)}</p>${q.type==='choice'?`<div class="opts">${q.options.map((o,i)=>`<button class="opt ${String(a)===String(i)?'selected':''}" data-reserve-pick="${attr(q.id)}" data-choice="${i}" ${locked?'disabled':''}><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`:`<input class="answer-input" type="text" inputmode="decimal" aria-label="Réponse à ${attr(q.id)}" value="${attr(a??'')}" data-reserve-input="${attr(q.id)}" ${locked?'disabled':''} placeholder="Ta réponse numérique">`}${locked?`<div class="answer-feedback ${ok?'':'bad'}">${ok?'✓ Exact : jeton gagné.':'✕ Deux erreurs : aucun jeton.'} ${esc(q.ex)}</div>`:tries===1?`<div class="answer-feedback bad">Erreur : il reste une tentative.</div><div class="actions"><button class="btn" data-reserve-check="${attr(q.id)}" ${a===undefined||a===null||String(a).trim()===''?'disabled':''}>Valider ma seconde réponse →</button></div>`:`<div class="actions"><button class="btn" data-reserve-check="${attr(q.id)}" ${a===undefined||a===null||String(a).trim()===''?'disabled':''}>Valider ma réponse →</button></div>`}</div>`}).join('')}

function ensureExam(){state.exam=state.exam||blank().exam;state.exam.work=state.exam.work||{};state.exam.annexWork=state.exam.annexWork||{};return state.exam}
function examRemaining(){return Math.max(0,75*60-Math.floor((Date.now()-(state.exam.startedAt||Date.now()))/1000))}
function renderExam(){let e=ensureExam();if(!examAllowed())return header('ÉPREUVE INDIVIDUELLE','BLACKOUT FINAL')+`<div class="empty">Les 7 missions doivent être terminées pour débloquer l'étude de cas.</div>`;if(e.complete)return examReview();let wallet=hintWalletHTML();if(!e.startedAt)return header('ÉTUDE DE CAS INDUSTRIELLE · 75 MIN','BLACKOUT FINAL','Cinq dossiers documentaires, vingt questions et un rapport de justification technique à produire.')+wallet+`<div class="actions">${missions.map(m=>`<button class="btn alt" data-reserve="${m.id}">Questions supplémentaires M${m.id} →</button>`).join('')}</div><div class="panel"><h3>Consignes du dossier technique</h3><p>Cette étude complète demande environ 75 minutes : <b>E1 (10 min), E2 (15 min), E3 (15 min), E4 (15 min), E5 (20 min)</b>. Chaque dossier comprend un schéma, des données industrielles et des travaux écrits. Les 20 réponses donnent une <b>note automatique indicative /20</b> ; les explications écrites sont conservées pour la vérification du formateur.</p><p>💡 <b>Indices à gagner :</b> chaque question supplémentaire validée après une mission donne 1 jeton, même si la réponse est fausse. Chaque indice pendant l’étude consomme 1 jeton. Les pénalités pédagogiques restent : aucun indice ×1, un indice ×0,90, deux indices ×0,75 sur le point de la question.</p><p>Tu peux revenir aux questions supplémentaires pour gagner des jetons, mais <b>le chronomètre continue</b> après démarrage. Les études validées ne peuvent plus être modifiées et les corrigés restent masqués jusqu’à la clôture.</p><p class="subtle">Important : une note calculée côté navigateur n'est ni certifiée par un serveur ni équivalente à la validation du raisonnement écrit.</p><div class="actions"><button class="btn" data-exam-start>⚡ Démarrer l’étude de cas — 75 minutes</button></div></div>`;
let stage=exam[e.stage];if(!stage){finalizeExam();return examReview()}let rem=examRemaining();if(rem<=0){finalizeExam();return examReview()}let mins=Math.floor(rem/60),secs=rem%60;let html=header('BLACKOUT FINAL · DOSSIER '+(e.stage+1)+' SUR 5',stage.title,'Étude de cas approfondie : documents, calculs et raisonnement. Objectif de durée : '+stage.time+' minutes.')+wallet+`<div class="actions">${missions.map(m=>`<button class="btn flat" data-reserve="${m.id}">🔓 Questions supplémentaires M${m.id}</button>`).join('')}</div><div class="panel"><div class="exam-head"><span class="pill purple">DOSSIER ${e.stage+1}/5 · ${stage.time} MIN CONSEILLÉES</span><span id="countdown" class="timer ${rem<=300?'urgent':''}">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</span></div><div class="progress" style="margin:13px 0"><div style="width:${100*e.stage/5}%"></div></div><div class="small muted">Le temps continue à courir. Les documents, schémas et valeurs restent consultables dans ce dossier.</div></div>`+caseIntroHTML(e.stage);
for(let qi=0;qi<stage.questions.length;qi++){let q=stage.questions[qi],a=e.answers[q.id],h=e.hints[q.id]||0,detail=caseDetails[e.stage].tasks[qi],work=e.work[q.id]||'';html+=`<div class="question"><div class="number">${esc(q.id)} • 1 POINT AUTOMATIQUE • DOSSIER ${e.stage+1}</div><h3>${esc(q.t)}</h3><p>${esc(q.p)}</p><div class="case-questions"><b>Travail complémentaire obligatoire à documenter :</b><p>${esc(detail[0])}</p><p class="small muted">À vérifier : ${esc(detail[1])}</p></div>${q.type==='choice'?`<div class="opts">${q.options.map((o,i)=>`<button class="opt ${String(a)===String(i)?'selected':''}" data-exam-choice="${attr(q.id)}" data-value="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`:`<label class="field">Résultat numérique (unité précisée dans l'énoncé)</label><input class="answer-input" type="text" inputmode="decimal" data-exam-number="${attr(q.id)}" value="${attr(a??'')}" placeholder="Ex. 2,67">`}<label class="field" for="work-${attr(q.id)}">✍️ Calculs, méthode et justification — conservés dans le bilan PDF</label><textarea class="method-area" id="work-${attr(q.id)}" data-exam-work="${attr(q.id)}" placeholder="Écris ici tes étapes de calcul, les unités, les constats et le raisonnement...">${esc(work)}</textarea><div class="actions"><button class="btn flat" data-exam-hint="${attr(q.id)}" ${h>=2||hintWallet()<=0?'disabled':''}>💡 ${h}/2 indices • coûte 1 jeton</button>${h===0&&hintWallet()===0?'<span class="small muted">🔒 Réalise des questions supplémentaires pour débloquer les indices.</span>':''}</div>${h>0?`<div class="hintbox">${esc(q.h1)}${h>1?' — '+esc(q.h2):''}</div>`:''}</div>`}
let blanks=stage.questions.filter(q=>e.answers[q.id]===undefined||e.answers[q.id]==='').length;let missingWork=stage.questions.filter(q=>(e.work[q.id]||'').trim().length<20).length;html+=`<div class="notice">${blanks} réponse(s) de résultat non renseignée(s) ; ${missingWork} justification(s) trop brève(s) ou absente(s). Le dossier sera validable avec un avertissement, car le temps est limité. Les blancs valent zéro ; les justifications nécessitent une vérification par le formateur.</div><div class="actions"><button class="btn" data-exam-submit>${e.stage===4?'Clôturer l’étude de cas':'Valider définitivement ce dossier →'}</button></div>`;return html}

function scoreExam(){let parts=[],total=0;for(const s of exam){for(const q of s.questions){let given=state.exam.answers[q.id],ok=questionCorrect(q,given),h=state.exam.hints[q.id]||0,coef=h===0?1:h===1?.9:.75,pt=ok?coef:0;total+=pt;parts.push({q,s,ok,h,coef,pt,given})}}return {score:Math.round(total*100)/100,parts}}

function examGrades(){const r=scoreExam();return {score:r.score,correct:r.parts.filter(p=>p.ok).length,rows:exam.map((d,i)=>{const ids=new Set(d.questions.map(q=>q.id)),a=r.parts.filter(p=>ids.has(p.q.id));return {name:'E'+(i+1)+' — '+d.title,score:Math.round(a.reduce((z,p)=>z+p.pt,0)*100)/100,max:a.length,correct:a.filter(p=>p.ok).length}})}}
function examAppreciation(n){return n>=16?'Excellent travail ! Les réponses montrent une très bonne maîtrise des notions.':n>=12?'Bon travail ! Quelques notions restent à consolider.':n>=10?'Résultat encourageant. Reprends les dossiers les moins réussis.':n>=6?'Plusieurs compétences sont à renforcer. Revois les cours et les corrections.':'Une reprise guidée des fondamentaux est recommandée.'}
function examGradePanel(print=false){const g=examGrades();return '<section class="'+(print?'print-grade-panel':'exam-grade-panel')+'"><h2>RÉSULTAT DE L’ÉTUDE DE CAS</h2><div class="exam-grade-number">'+fmt(g.score)+' <small>/ 20</small></div><p><b>Note automatique indicative :</b> '+g.correct+' bonnes réponses sur 20</p><p><b>VOLT-X :</b> '+esc(examAppreciation(g.score))+'</p><h3>Détail des cinq dossiers</h3><table><thead><tr><th>Dossier</th><th>Réussite</th><th>Note</th></tr></thead><tbody>'+g.rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.correct+' / '+x.max+'</td><td><b>'+fmt(x.score)+' / '+x.max+'</b></td></tr>').join('')+'</tbody></table><p class="small">Les indices utilisés diminuent les points. Les justifications et travaux écrits doivent être évalués séparément par le formateur. Note non certifiée par un serveur.</p></section>'}

function finalizeExam(){if(state.exam.complete)return;state.exam.complete=true;state.exam.completedAt=Date.now();save();toast('Épreuve clôturée : bilan disponible.')}
function examReview(){let r=scoreExam(),e=state.exam;return header('ÉPREUVE TERMINÉE','Bilan individuel BLACKOUT FINAL','Ta note est disponible ci-dessous et dans ton bilan PDF.')+examGradePanel()+`<div class="stats"><div class="stat"><div class="label">NOTE AUTOMATIQUE INDICATIVE</div><strong>${fmt(r.score)}/20</strong></div><div class="stat"><div class="label">BONNES RÉPONSES</div><strong>${r.parts.filter(x=>x.ok).length}/20</strong></div><div class="stat"><div class="label">INDICES UTILISÉS</div><strong>${r.parts.reduce((s,x)=>s+x.h,0)}</strong></div><div class="stat"><div class="label">DURÉE</div><strong>${e.startedAt?fmt(Math.min(75,(e.completedAt-e.startedAt)/60000)):0} min</strong></div></div>${speaker('voltx',r.score>=15?'Bravo ! De nombreux acquis sont solides. Analyse les erreurs restantes pour progresser.':r.score>=10?'Des acquis sont présents, mais plusieurs compétences sont à renforcer avec les corrections.':'Le bilan repère des difficultés. Reprends les capsules de cours avant un nouvel entraînement.')}${r.parts.map(x=>`<div class="card" style="margin:10px 0"><div class="tag">${esc(x.q.id)} · ${fmt(x.pt)} / 1 pt · ${x.h} indice(s)</div><h3>${esc(x.q.t)} ${x.ok?'✓':'✕'}</h3><p class="small muted">Réponse : ${esc(x.given===undefined||x.given===''?'Non répondu':x.q.type==='choice'?x.q.options[Number(x.given)]:x.given)}</p><div class="answer-feedback ${x.ok?'':'bad'}">${maths(x.q.ex)}</div><p class="small muted"><b>Ton raisonnement :</b> ${esc((e.work||{})[x.q.id]||'Non fourni')}</p></div>`).join('')}<div class="actions"><button class="btn" data-print="exam">🖨 Exporter mon bilan PDF</button><button class="btn purple" data-nav="shop">Accéder à la boutique →</button></div>'+replayPanel()+'<div class="notice">V0.6 : score automatique indicatif distinct de la validation manuelle des raisonnements par le formateur. Aucune certification serveur. La note n'est pas certifiée par un serveur.</div>`}
function shopPage(){if(!shopAllowed())return header('BOUTIQUE DE L’OMBRE','Arsenal verrouillé','Termine le BLACKOUT FINAL pour acheter les questions Flash.')+`<div class="empty">⚑ La boutique s’ouvre après l’évaluation individuelle.</div>`;return header('BOUTIQUE DE L’OMBRE','Le marché noir des questions','50 Flash à prix progressifs : 100 CE (facile), 150 CE (intermédiaire), 200 CE (difficile). Les achats ne modifient pas les crédits déjà gagnés pour ton classement.')+speaker('ombre','Des questions pour écraser les équipes adverses ! Choisis-les avec soin : après l’export final, ta sélection sera figée.')+`<div class="stats"><div class="stat"><div class="label">SOLDE DISPONIBLE</div><strong>${fmt(balance())} CE</strong></div><div class="stat"><div class="label">ACHETÉES</div><strong>${state.shopBought.length}/50</strong></div><div class="stat"><div class="label">PRIX DES FLASH</div><strong>100–200 CE</strong></div><div class="stat"><div class="label">ARSENAL</div><strong>${state.arsenal?'FIGÉ':'OUVERT'}</strong></div></div><div class="panel"><div class="field-row"><div><label>Domaine</label><select id="shop-domain"><option value="all">Tous les domaines</option>${[...new Set(shop.map(q=>q.domain))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div><label>Difficulté</label><select id="shop-difficulty"><option value="all">Toutes</option><option>Facile</option><option>Intermédiaire</option><option>Difficile</option></select></div></div><p class="small muted">Les titres et domaines sont visibles avant achat ; les questions complètes se dévoilent après achat.</p></div><div class="section-heading"><h2>Catalogue Flash</h2><span class="tag" id="shop-count">50 questions</span></div><div class="shop-grid" id="shop-grid"></div><div class="section-heading"><h2>Mon Arsenal (${state.shopBought.length})</h2></div>${state.shopBought.length?`<div class="panel">${state.shopBought.map(id=>{let q=shop.find(x=>x.id===id);return `<div style="padding:12px 0;border-bottom:1px solid var(--border)"><strong>${esc(id)} — ${esc(q.title)}</strong><p class="small">${maths(q.prompt)}</p><div class="small muted">${q.options.map((x,i)=>'ABCD'[i]+'. '+esc(x)).join(' · ')}</div></div>`}).join('')}</div>`:`<div class="empty">Aucune question achetée pour l'instant.</div>`}${state.arsenal?`<div class="panel"><h3>✓ Corrigé de ton Arsenal (${state.arsenal.questions.length} questions)</h3><p class="small muted">Ces réponses figurent également sous chaque question dans l'export PDF.</p>${state.arsenal.questions.map((q,i)=>{const solution=flashSolution(q);return `<div class="answer-feedback"><b>${i+1}. ${esc(q.id)} — ${solution?esc(solution.letter+' : '+solution.answer):'À vérifier'}</b><p>${solution?maths(solution.explanation):'Réponse non disponible.'}</p></div>`}).join('')}</div>`:''}<div class="actions">${state.arsenal?`<button class="btn" data-print="arsenal">🖨 Exporter les questions et leurs réponses en PDF</button>`:`<button class="btn purple" data-freeze ${!state.shopBought.length?'disabled':''}>Figer l'Arsenal et exporter le PDF corrigé</button>`}</div><div class="notice">L’export utilise « Imprimer → Enregistrer au format PDF ». Une fois figé, l’Arsenal ne peut plus être modifié dans cette session. Le PDF comprend les bonnes réponses et leurs explications après chaque question Flash.</div>`}
function shopFilter(){let domain=$('shop-domain')?.value||'all',difficulty=$('shop-difficulty')?.value||'all';let rows=shop.filter(x=>(domain==='all'||domain===x.domain)&&(difficulty==='all'||difficulty===x.difficulty));$('shop-count').textContent=rows.length+' questions';$('shop-grid').innerHTML=rows.map(q=>{let bought=state.shopBought.includes(q.id);return `<div class="shop-item"><div class="kicker">${esc(q.id)} · ${esc(q.domain)}</div><h3>${esc(q.title)}</h3><p>${esc(q.difficulty)} · ${q.minutes} min · 2 points bruts</p>${bought?`<p class="small">${esc(q.prompt)}</p>`:`<p>Question accessible après achat ; détails conservés dans ton Arsenal.</p>`}<div class="bottom"><strong style="color:var(--gold)">⚡ ${q.price} CE</strong><button class="btn ${bought?'alt':''}" data-buy="${esc(q.id)}" ${bought||state.arsenal||balance()<q.price?'disabled':''}>${bought?'✓ Achetée':state.arsenal?'Arsenal figé':'Acheter'}</button></div></div>`}).join('')}


function replayExportKind(){return state.exam.complete?'exam':'missions'}
function replayMayStart(){return !teacherMode&&(passed()>0||!!state.exam.startedAt||!!state.exam.complete)}
function replayExportDone(){return replayExportKind()==='exam'?!!state.examExportRequested:!!state.missionsExportRequested}
function replayPanel(){
 if(!replayMayStart())return '';
 const end=!!state.exam.complete,exportKind=replayExportKind(),ready=replayExportDone();
 return '<section class="panel replay-panel" id="restart-panel"><h3>↻ Recommencer le jeu depuis la mission 1</h3>'
 +'<p>Tu peux refaire les missions et l’étude de cas. Cela remet à zéro les crédits, les jetons, les achats Flash et les réponses en cours.</p>'
 +(end?'<p><b>Étude de cas terminée :</b> sauvegarde d’abord ton bilan noté /20. Ta note sera conservée dans l’historique de cet appareil.</p>':'<p><b>Évaluation non terminée :</b> enregistre d’abord le bilan de tes missions. Aucune note finale /20 n’a encore été attribuée.</p>')
 +'<div class="actions"><button class="btn alt" data-print="'+exportKind+'">① Exporter mon '+(end?'bilan noté':'bilan de missions')+' en PDF</button></div>'
 +'<label class="replay-check"><input type="checkbox" id="replay-confirm-pdf"> Je confirme avoir enregistré le PDF sur mon appareil.</label>'
 +'<div class="actions"><button class="btn" data-restart-game '+(!ready?'disabled':'')+'>② Recommencer depuis la mission 1</button></div>'
 +'<p class="small muted">Attention : le fichier PDF est la seule copie complète de tes anciennes réponses. Le site ne peut pas vérifier le téléchargement. Un message de confirmation apparaîtra avant la remise à zéro.</p></section>';
}
function restartGame(){
 if(!replayMayStart())return;
 const exportKind=replayExportKind();
 if(!replayExportDone())return toast('Exporte d’abord le bilan PDF.');
 if(!document.getElementById('replay-confirm-pdf')?.checked)return toast('Confirme avoir enregistré le PDF.');
 if(!confirm('Confirmer une nouvelle partie ? La progression actuelle, les réponses, les jetons et les achats seront réinitialisés. Vérifie que ton PDF est bien enregistré.'))return;
 const history=Array.isArray(state.examHistory)?state.examHistory.slice():[];
 if(state.exam.complete){const g=examGrades();history.push({date:state.exam.completedAt||Date.now(),score:g.score,correct:g.correct,profile:{...state.profile},rows:g.rows.map(x=>({name:x.name,score:x.score,max:x.max}))})}
 const fresh=blank();fresh.profile={...state.profile};fresh.examHistory=history;fresh.shopPaid={};fresh.examExportRequested=false;fresh.missionsExportRequested=false;
 state=fresh;guidePage=0;guideOpen=true;save();render();window.scrollTo(0,0);
}
function historyPanel(){const h=Array.isArray(state.examHistory)?state.examHistory:[];if(!h.length)return '';
 return '<section class="panel"><h3>Historique des tentatives</h3><p class="small muted">Notes conservées dans ce navigateur. Les détails des anciennes copies sont dans les PDF précédemment exportés.</p><table class="replay-history"><thead><tr><th>#</th><th>Date</th><th>Note</th></tr></thead><tbody>'+h.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+new Date(x.date).toLocaleString('fr-FR')+'</td><td>'+fmt(x.score)+' / 20</td></tr>').join('')+'</tbody></table></section>';
}
function reports(){return header('RÉSULTATS & EXPORTS','Mes bilans','Tu peux imprimer les rapports et les enregistrer en PDF depuis le navigateur.')+`<div class="stats"><div class="stat"><div class="label">CRÉDITS HISTORIQUES</div><strong>${fmt(earned())}</strong></div><div class="stat"><div class="label">SOLDE BOUTIQUE</div><strong>${fmt(balance())}</strong></div><div class="stat"><div class="label">MISSIONS FINIES</div><strong>${passed()}/7</strong></div><div class="stat"><div class="label">NOTE FINALE</div><strong>${state.exam.complete?fmt(scoreExam().score)+'/20':'—'}</strong></div></div><div class="panel"><h3>Identification du rapport</h3><div class="field-row"><div><label>Nom</label><input id="profile-name" type="text" value="${attr(state.profile.name)}" placeholder="Nom"></div><div><label>Prénom</label><input id="profile-first" type="text" value="${attr(state.profile.first)}" placeholder="Prénom"></div><div><label>Équipe</label><input id="profile-team" type="text" value="${attr(state.profile.team)}" placeholder="Équipe A"></div><div><label>Session</label><input id="profile-session" type="text" value="${attr(state.profile.session)}"></div></div><button class="btn alt" data-save-profile>✓ Enregistrer l'identité</button></div><div class="section-heading"><h2>Rapports</h2></div><div class="mission-grid"><div class="card"><h3>① Bilan des sept missions</h3><p class="subtle">Crédits, réussites, erreurs et corrections, par mission.</p><button class="btn" data-print="missions" ${passed()===0?'disabled':''}>Exporter en PDF</button></div><div class="card"><h3>② BLACKOUT FINAL</h3><p class="subtle">Note sur 20, temps, indices, réponses et corrigés après clôture.</p><button class="btn" data-print="exam" ${!state.exam.complete?'disabled':''}>Exporter en PDF</button></div><div class="card"><h3>③ Arsenal Flash</h3><p class="subtle">Questions achetées avec bonnes réponses et explications, identité et référence de session.</p><button class="btn ${state.arsenal?'':'alt'}" data-print="arsenal" ${!state.arsenal?'disabled':''}>Exporter Arsenal corrigé</button></div></div><div class="notice">Le PDF est enregistré par le navigateur, pas par un serveur. Pour le transfert au formateur, conserve le fichier sur ton appareil puis remets-le selon la consigne donnée en cours.</div>`+historyPanel()+replayPanel()}
const professionalCorrections=[["24/48=0,50 A ; P=24×0,50=12 W. Sous 12 V : I=12/48=0,25 A ; P=12×0,25=3 W, en supposant R=48 Ω constante.","12 V aux bornes de R1 démontrent une sous-tension sans identifier la cause : alimentation, connexions et liaisons restent à examiner.","Contrôle documentaire de la source puis de la liaison et du récepteur ; mesures réalisées suivant habilitation et procédure de sécurité adaptées."],["S1=√3×400×10/1000=6,928 kVA ; P1=5,543 kW ; Q1=+4,157 kvar. P2=3 kW et Q2=+4 kvar. Total P=8,543 kW ; Q=8,157 kvar ; S≈11,81 kVA.","La somme directe des S est incorrecte : sommer les puissances P et Q signées puis calculer la norme S=√(P²+Q²).","La compensation permet de réduire Q et parfois le courant ; relever les profils de charge, cosφ réel, contraintes du réseau et éviter toute surcompensation."],["400/690 V Δ/Y ; 5,5 kW utiles ; 88 % ; 50 Hz ; 4 pôles ; 1460 tr/min. Courant In absent : rechercher la plaque réelle ou la notice.","Pabs=5,5/0,88=6,25 kW ; pertes=0,75 kW ; ns=120×50/4=1500 tr/min ; écart=40 tr/min ; glissement≈2,67 %.","Sous 400 V, couplage nominal triangle : 400 V par enroulement. En étoile : 400/√3≈231 V, donc sous-alimentation."],["Q1 : protection court-circuit ; KM1 : contacteur ; F1 : surcharge ; U1/V1/W1 : entrée moteur ; PE : protection des masses. Sectionnement séparé non à présumer sur le schéma extrait.","Courants moins In=11 A : +1,8 A, +2,0 A et +1,7 A ; moyenne 12,83 A soit +1,83 A (+16,7 %). La cause de cet écart reste inconnue.","Réglage thermique initial proche de 11 A, à confirmer sur plaque et notice. Contrôler charge mécanique, ventilation, tension et historique sans shunter les protections."],["Repos : MA NO ouvert, KM1 hors tension. Appui MA : 24 V sur bobine, auxiliaire de maintien doit se fermer. Relâchement avec maintien sain : bobine reste alimentée ; appui AT : arrêt.","24 V pendant appui, 0 V au relâchement : alimentation de bobine perdue ; contrôle du contact auxiliaire ou des connexions XC hors tension selon procédure.","Compte rendu : symptôme, mesures, hypothèses non prouvées, contrôles sécurisés par personnel habilité, puis validation du maintien et des protections avant remise en service."]];
function rubricHTML(){return '<h2>Validation formateur /20 — à remplir après lecture des justifications</h2><p>Pour chaque dossier : données et unités 0,5 pt ; méthode 1 pt ; calcul / lecture du schéma 1 pt ; diagnostic argumenté 1 pt ; sécurité et conclusion 0,5 pt. Ce barème est distinct de la note automatique /20. Seul le formateur valide et signe la copie imprimée.</p><table><tr><th>Dossier</th><th>Note manuelle</th></tr>'+['E1 · Fondamentaux','E2 · Puissances','E3 · Moteur','E4 · Départ moteur','E5 · Commande'].map(t=>'<tr><td>'+t+'</td><td>........ /4</td></tr>').join('')+'</table><p>Total validé : ........ /20 ; Formateur : ........................ ; Date : ................ ; Signature : ........................</p>'}
const shopCorrections={"F-001":{"index":2,"explanation":"La résistance électrique se mesure en ohms (Ω)."},"F-002":{"index":1,"explanation":"Un voltmètre mesure une différence de potentiel et se branche en parallèle aux bornes du récepteur."},"F-003":{"index":0,"explanation":"Loi d’Ohm : I = U/R = 10/20 = 0,5 A."},"F-004":{"index":2,"explanation":"Dans un circuit série ouvert en courant continu, le courant est nul."},"F-005":{"index":1,"explanation":"À résistance constante, I = U/R : diviser U par 2 divise I par 2."},"F-006":{"index":1,"explanation":"À résistance constante, P = U²/R : doubler U multiplie P par 4."},"F-007":{"index":1,"explanation":"La puissance apparente se mesure en voltampères (VA)."},"F-008":{"index":2,"explanation":"Pour une charge résistive idéale en régime sinusoïdal, cos φ = 1."},"F-009":{"index":2,"explanation":"S = √(P² + Q²) = √(6² + 8²) = 10 kVA."},"F-010":{"index":1,"explanation":"En triphasé équilibré sinusoïdal : P = √3 × U × I × cos φ, avec U tension composée."},"F-011":{"index":1,"explanation":"Q total = (+4) + (−3) = +1 kvar : addition algébrique des puissances réactives."},"F-012":{"index":1,"explanation":"Sur un réseau 230/400 V, la tension entre phase et neutre est 230 V."},"F-013":{"index":1,"explanation":"Pour une plaque 230/400 V Δ/Y sur réseau 400 V, le couplage nominal est étoile."},"F-014":{"index":1,"explanation":"Pour ce bornier repéré W2/U2/V2 en haut et U1/V1/W1 en bas, le triangle utilise trois barrettes verticales."},"F-015":{"index":2,"explanation":"En étoile, chaque enroulement reçoit 400/√3 ≈ 231 V."},"F-016":{"index":2,"explanation":"Le stator est la partie fixe de la machine ; le rotor tourne."},"F-017":{"index":3,"explanation":"nₛ = 120 × f/Nₚ = 120 × 60/2 = 3 600 tr/min."},"F-018":{"index":0,"explanation":"Le glissement permet l’induction des courants rotorique et la production de couple."},"F-019":{"index":1,"explanation":"g = (nₛ − n)/nₛ × 100 = (1500 − 1440)/1500 × 100 = 4 %."},"F-020":{"index":2,"explanation":"À fréquence et nombre de pôles inchangés, la baisse de vitesse augmente le glissement ; un diagnostic reste nécessaire."},"F-021":{"index":0,"explanation":"Les kW inscrits sur une plaque moteur correspondent en général à la puissance mécanique utile nominale."},"F-022":{"index":2,"explanation":"η = Pᵤ/Pₐᵦₛ = 4,8/4 = 1,2 = 120 %, impossible sans autre apport d’énergie."},"F-023":{"index":1,"explanation":"Pₐᵦₛ = Pᵤ/η = 4,5/0,90 = 5 kW."},"F-024":{"index":1,"explanation":"Le contacteur effectue la manœuvre normale du circuit ; il n’est pas une protection universelle."},"F-025":{"index":0,"explanation":"Le relais thermique détecte principalement les surcharges prolongées, pas les courts-circuits."},"F-026":{"index":1,"explanation":"Pour un relais thermique classique, le contact NO de signalisation de déclenchement est généralement 97–98."},"F-027":{"index":2,"explanation":"Un sectionneur permet la séparation électrique ; il n’assure pas à lui seul la protection automatique."},"F-028":{"index":0,"explanation":"Le bouton Marche utilise généralement un contact normalement ouvert (NO) au repos."},"F-029":{"index":1,"explanation":"Le contact auxiliaire NO KM1 13–14, en parallèle avec Marche, réalise l’auto-maintien."},"F-030":{"index":1,"explanation":"Deux boutons Marche NO permettant de commander depuis deux postes sont normalement câblés en parallèle."},"F-031":{"index":1,"explanation":"Les dipôles montés en série sont parcourus par la même intensité."},"F-032":{"index":1,"explanation":"250 mA = 250/1000 A = 0,25 A."},"F-033":{"index":2,"explanation":"Pour deux résistances de 100 Ω en parallèle, Rₑq = (100 × 100)/(100 + 100) = 50 Ω."},"F-034":{"index":0,"explanation":"Un ampèremètre à faible résistance branché directement aux bornes d’une source risque de provoquer une forte surintensité."},"F-035":{"index":2,"explanation":"2,5 kW = 2,5 × 1000 = 2500 W."},"F-036":{"index":0,"explanation":"Énergie E = P × t = 2 kW × 3 h = 6 kWh."},"F-037":{"index":1,"explanation":"En régime sinusoïdal, cos φ = P/S = 4/5 = 0,8."},"F-038":{"index":1,"explanation":"P total = 3 + 3 = 6 kW ; Q total = +4 − 4 = 0 kvar ; S total = √(6² + 0²) = 6 kVA."},"F-039":{"index":1,"explanation":"En triangle, chaque enroulement reçoit la tension composée du réseau, soit 400 V."},"F-040":{"index":0,"explanation":"En étoile, l’intensité de ligne est égale à celle de l’enroulement : 8 A."},"F-041":{"index":2,"explanation":"Le couplage triangle sous 400 V impose 400 V à chaque enroulement prévu pour 230 V : surtension dangereuse."},"F-042":{"index":0,"explanation":"Les courants du rotor à cage naissent par induction électromagnétique."},"F-043":{"index":3,"explanation":"Nₚ = 120 × f/nₛ = 120 × 50/750 = 8 pôles."},"F-044":{"index":2,"explanation":"nₛ = 1500 tr/min ; g = (1500 − 1400)/1500 × 100 ≈ 6,67 %."},"F-045":{"index":0,"explanation":"Pᵤ = Pₐᵦₛ − pertes = 8 − 2 = 6 kW."},"F-046":{"index":1,"explanation":"Pₐᵦₛ = Pᵤ/η = 9/0,90 = 10 kW ; pertes = 10 − 9 = 1 kW."},"F-047":{"index":2,"explanation":"Le contact thermique NF 95–96 ouvre normalement la chaîne de commande lors d’un déclenchement."},"F-048":{"index":3,"explanation":"En cas de déclenchement répété, il faut diagnostiquer la cause et vérifier la protection avant toute remise en service."},"F-049":{"index":0,"explanation":"Le bouton Arrêt NF ouvre la commande lorsqu’on appuie dessus ; il favorise aussi une logique de rupture de fil sûre selon le montage."},"F-050":{"index":1,"explanation":"L’interverrouillage évite la fermeture simultanée des deux contacteurs d’inversion."}};
function flashSolution(q){const k=shopCorrections[q.id];if(!k||!Array.isArray(q.options)||k.index<0||k.index>=q.options.length)return null;return {letter:'ABCD'[k.index],answer:q.options[k.index],explanation:k.explanation};}
function flashCorrectionReport(questions){return '<section class="flash-answers"><h2>CORRIGÉ DES QUESTIONS FLASH</h2><p>Chaque réponse reprend le numéro et la référence de la question. Conserve cette page pour préparer la restitution orale.</p>'+questions.map((q,i)=>{let sol=flashSolution(q);return '<div class="print-q"><b>Question '+(i+1)+' — '+esc(q.id)+' — '+esc(q.title)+'</b><p><b>Bonne réponse : </b>'+(sol?esc(sol.letter+' — '+sol.answer):'Corrigé indisponible')+'</p><p><b>Explication : </b>'+(sol?maths(sol.explanation):'Faire vérifier par le formateur')+'</p></div>'}).join('')+'</section>'}
function reportMarkup(kind){const pf=state.profile;let id=`${esc(pf.name)} ${esc(pf.first)} · ${esc(pf.team)} · ${esc(pf.session)}`;let intro=`<h1>BLACKOUT INDUSTRY — ${kind==='exam'?'BLACKOUT FINAL':kind==='missions'?'BILAN DES MISSIONS':'ARSENAL FLASH'}</h1><p><b>Apprenti :</b> ${id}<br><b>Version :</b> V0.6 · <b>Date :</b> ${new Date(kind==='arsenal'&&state.arsenal?state.arsenal.date:Date.now()).toLocaleString('fr-FR')}</p>`;if(kind==='missions')return intro+`<h2>Scores : ${fmt(earned())} CE historiques</h2><table><thead><tr><th>Mission</th><th>Crédits</th><th>Réussite</th><th>Temps</th></tr></thead><tbody>${missions.map(m=>{let r=state.missionResults[m.id];return `<tr><td>${esc(m.name)}</td><td>${r?fmt(r.score):'—'}</td><td>${r?r.correct+'/'+r.total:'—'}</td><td>${r?fmt(r.minutes)+' min':'—'}</td></tr>`}).join('')}</tbody></table>`+missions.filter(m=>state.missionResults[m.id]).map(m=>`<h2>${esc(m.name)}</h2><table><thead><tr><th>Question</th><th>Réponse</th><th>Statut</th><th>Explication</th></tr></thead><tbody>${state.missionResults[m.id].details.map(d=>`<tr><td>${esc(d.id)} ${esc(d.title)}</td><td>${esc(d.given)}</td><td>${d.ok?'Juste':'À revoir'}</td><td>${esc(d.ex)}</td></tr>`).join('')}</tbody></table>`).join('');if(kind==='exam'){let r=scoreExam();return intro+examGradePanel(true)+`<h2>Corrigé détaillé et justifications écrites</h2><p>Jetons gagnés : ${earnedHintTokens()} ; jetons utilisés : ${usedHintTokens()}.</p><p>Épreuve de 75 minutes · Durée enregistrée : ${fmt(Math.min(75,(state.exam.completedAt-state.exam.startedAt)/60000))} minutes</p><table><thead><tr><th>Réf.</th><th>Réponse</th><th>Points</th><th>Indices</th><th>Corrigé expliqué</th><th>Raisonnement écrit</th></tr></thead><tbody>${r.parts.map(x=>`<tr><td>${esc(x.q.id)}</td><td>${esc(x.given===undefined?'Non répondu':x.q.type==='choice'?x.q.options[Number(x.given)]:x.given)}</td><td>${fmt(x.pt)}/1</td><td>${x.h}</td><td>${esc(x.q.ex)}</td><td>${esc((state.exam.work||{})[x.q.id]||"Aucune justification")}</td></tr>`).join('')}</tbody></table>`+caseInvestigations.map((tasks,k)=>`<h2>Dossier E${k+1} — Travaux documentaires complémentaires</h2>`+tasks.map((task,i)=>{let key='E'+(k+1)+'-A'+(i+1);return `<div class="print-q"><b>${esc(task[0])}</b><p>${maths(task[1])}</p><p><b>Réponse de l’apprenti :</b> ${esc(caseAnswerText(key))}</p><p><b>Corrigé argumenté :</b> ${maths(professionalCorrections[k][i])}</p></div>`}).join('')).join('')+rubricHTML()}let ar=state.arsenal;if(!ar)return intro+'<p>Aucun Arsenal figé.</p>';return intro+`<p><b>Identifiant Arsenal :</b> ${esc(ar.id)}<br><b>Figé le :</b> ${new Date(ar.date).toLocaleString('fr-FR')}<br><b>Questions :</b> ${ar.questions.length} · <b>CE dépensés :</b> ${ar.questions.reduce((t,q)=>t+(q.paidPrice??q.price??100),0)}</p><p>Document des questions Flash, avec la bonne réponse et son explication directement sous chaque question, puis le corrigé récapitulatif en dernière partie.</p>`+ar.questions.map((q,i)=>`<div class="print-q"><b>${i+1}. ${esc(q.id)} — ${esc(q.title)}</b> (${esc(q.domain)})<p>${esc(q.prompt)}</p>${q.options.map((o,j)=>`<p style="margin:4px 0">☐ ${'ABCD'[j]}. ${esc(o)}</p>`).join('')}<p><b>Justification (si demandée) :</b></p><div class="print-space"></div><div class="flash-inline-answer"><b>✓ BONNE RÉPONSE : ${flashSolution(q)?esc(flashSolution(q).letter+' — '+flashSolution(q).answer):'À vérifier'}</b><p><b>Explication :</b> ${flashSolution(q)?maths(flashSolution(q).explanation):'Non disponible'}</p></div></div>`).join('')+flashCorrectionReport(ar.questions)}
