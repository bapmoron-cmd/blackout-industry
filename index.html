{id:1,name:'Réveil électrique',duration:25,desc:'Réparer l’alimentation de commande 24 V.',topic:'Loi d’Ohm et puissance',lesson:'Tension U (V), courant I (A), résistance R (Ω) : U = R × I. Puissance en continu : P = U × I. Le voltmètre se branche aux bornes du récepteur.',training:[Q('M1-01','Quelle unité correspond à la résistance ?','Associe la grandeur R à son unité.',['Volt','Ohm','Ampère','Watt'],1,'La résistance est notée R.','Son unité utilise la lettre grecque Ω.','R se mesure en ohms.'),N('M1-03','Courant de référence','Sous 24 V, une résistance de 48 Ω absorbe combien d’ampères ?',.5,'I = U/R.','24 ÷ 48','I = 24/48 = 0,5 A.')],challenges:[N('M1-05','Réparer le circuit','24 V sur 60 Ω : calculer I en ampères.',.4,'Loi d’Ohm.','I = U/R.','24/60 = 0,40 A.'),N('M1-06','Résistance fantôme','24 V et 0,30 A : calculer R en ohms.',80,'Isoler R.','R = U/I.','24/0,30 = 80 Ω.'),N('M1-07','Sous-tension','Une résistance fixe de 48 Ω reçoit seulement 12 V : calculer I en ampères.',.25,'Recalculer à la tension mesurée.','I = 12/48.','Le courant vaut 0,25 A ; la cause de la sous-tension reste à investiguer.')]},
{id:2,name:'Guerre des puissances',duration:35,desc:'Rétablir le bilan énergétique.',topic:'P, Q, S et cos φ',lesson:'Régime triphasé équilibré sinusoïdal : S = √3 UI ; P = √3 UI cosφ ; Q = √3 UI sinφ. Pour plusieurs charges, additionner P et Q séparément, puis S total = √(P²+Q²).',training:[Q('M2-01','La puissance apparente','Quelle est son unité ?',['W','VA','var','V'],1,'La lettre est S.','Voltampère.','S en VA, P en W, Q en var.'),N('M2-03','Triangle des puissances','P = 800 W et Q = 600 var : déterminer S en VA.',1000,'Pythagore.','√(800²+600²).','S = 1000 VA.')],challenges:[N('M2-05','Récepteur monophasé','230 V × 6 A : calculer S en VA.',1380,'En monophasé : S = UI.','230 × 6.','S = 1380 VA.'),N('M2-06','Moteur triphasé','Réseau 400 V, I = 14 A, cosφ = 0,85 : calculer P en kW.',8.244,'Utilise la relation triphasée.','P = √3 × 400 × 14 × 0,85 / 1000.','P ≈ 8,244 kW.'),N('M2-07','Bilan de charges','P total = 6 kW et Q total = 2 kvar : calculer S total en kVA.',6.3249,'S n’est pas P + Q.','√(6²+2²).','S ≈ 6,325 kVA.'),N('M2-08','Le courant introuvable','P = 9 kW, U = 400 V, cosφ = 0,90 : calculer I de ligne en A.',14.4338,'Isoler I.','I = 9000/(√3×400×0,9).','I ≈ 14,43 A.')]},
{id:3,name:'Chaos triphasé',duration:30,desc:'Retrouver les bons couplages moteurs.',topic:'Étoile, triangle et tensions',lesson:'En étoile Y, chaque enroulement reçoit la tension composée / √3. En triangle Δ, chaque enroulement reçoit la tension composée. Plaque 230/400 Δ/Y : Y sous 400 V ; plaque 400/690 Δ/Y : Δ sous 400 V.',training:[Q('M3-01','Tension simple','Dans un réseau 230/400 V, la tension phase-neutre vaut :',['400 V','690 V','230 V','24 V'],2,'Entre phase et neutre.','La petite valeur.','230 V.'),Q('M3-03','Choisir le couplage','Moteur 230/400 V Δ/Y sur réseau 400 V entre phases :',['Triangle','Étoile','Aucun','Les deux'],1,'L’enroulement nominal est prévu pour 230 V.','En Y, 400/√3 ≈ 230 V.','Couplage étoile.')],challenges:[Q('M3-05','Convoyeur M1','Plaque 400/690 V Δ/Y, réseau 400 V : couplage nominal ?',['Étoile','Triangle','Sans barrettes','Impossible'],1,'Comparer la plus petite tension de plaque.','400 V correspond à Δ.','Triangle, 400 V à chaque enroulement.'),N('M3-06','Tension des enroulements','Moteur en étoile sur réseau 400 V : tension d’enroulement en V ?',230.94,'En étoile, diviser par √3.','400/√3.','Environ 231 V.'),Q('M3-07','Couplage incorrect','230/400 Δ/Y branché Δ sur 400 V : que reçoit chaque enroulement ?',['230 V','400 V','0 V','690 V'],1,'En triangle la tension des enroulements = U composée.','400 V et non 230 V.','400 V sur un enroulement prévu pour 230 V : couplage inadapté.')]},
{id:4,name:'Moteur en surchauffe',duration:40,desc:'Analyser les vitesses et le glissement.',topic:'Moteur asynchrone',lesson:'Un moteur asynchrone triphasé à cage comporte stator fixe et rotor mobile. n synchronisme = 120 f / nombre total de pôles. Glissement en % = (ns − n)/ns × 100. Le glissement seul ne prouve pas la cause d’une panne.',training:[Q('M4-01','Le stator','Quelle partie reste fixe ?',['Rotor','Stator','Arbre','Ventilateur'],1,'Le nom est stator.','Il porte les enroulements statoriques.','Stator fixe.'),N('M4-03','Vitesse du champ','4 pôles sous 50 Hz : ns en tr/min ?',1500,'ns = 120 f / p.','120 × 50 / 4.','1500 tr/min.')],challenges:[N('M4-05','Le moteur à 60 Hz','Moteur 4 pôles à 60 Hz : ns en tr/min ?',1800,'Utilise la fréquence de 60 Hz.','120 × 60 / 4.','1800 tr/min.'),N('M4-06','Le moteur ralentit','ns = 1500 tr/min, n = 1380 tr/min : glissement en % ?',8,'Différence relative.','(1500−1380)/1500×100.','8 %. On ne peut pas affirmer la cause.'),N('M4-07','Champ tournant saboté','4 pôles, fréquence 40 Hz : ns en tr/min ?',1200,'Fréquence modifiée.','120 × 40 / 4.','1200 tr/min.'),N('M4-08','BOSS convoyeur','ns = 1500 tr/min, n = 1410 tr/min : glissement en % ?',6,'Différence des vitesses.','90 / 1500 × 100.','6 % ; vérifier charge, alimentation et ventilation sans conclure prématurément.')]},
{id:5,name:'Rendement critique',duration:45,desc:'Reconstituer le bilan énergétique du moteur.',topic:'Rendement et pertes',lesson:'P absorbée = puissance électrique active prise au réseau ; P utile = puissance mécanique à l’arbre. η = P utile / P absorbée. P pertes = P absorbée − P utile. Pour un moteur réel : η ≤ 1.',training:[Q('M5-01','Puissance nominale','Une plaque moteur indique 5,5 kW : généralement il s’agit de :',['P absorbée','P utile mécanique','P réactive','P apparente'],1,'C’est la puissance de sortie de l’arbre.','Puissance mécanique utile.','La plaque donne généralement la puissance mécanique utile nominale.'),N('M5-03','Rendement express','P utile = 2000 W, P absorbée = 2500 W : rendement en % ?',80,'η = Pu/Pa.','2000/2500×100.','80 %.')],challenges:[N('M5-05','Moteur gourmand','P absorbée = 8 kW, P utile = 6,8 kW : η en % ?',85,'Rapport sortie/entrée.','6,8/8×100.','85 %.'),N('M5-06','Plaque convoyeur','P utile = 5,5 kW, η = 88 % : P absorbée en kW ?',6.25,'Divise par le rendement en décimal.','5,5 / 0,88.','6,25 kW.'),N('M5-07','Triphasé et rendement','400 V, 10 A, cosφ 0,8, η 85 % : P utile en kW ?',4.711,'Calcule d’abord P absorbée.','0,85×√3×400×10×0,8/1000.','4,711 kW.'),N('M5-08','Choix moteur','Pu utile 7,5 kW ; η A=85 %, η B=92 %. Économie de puissance active B vs A en kW ?',0.6714,'Comparer Pu/η pour chacun.','7,5/0,85 − 7,5/0,92.','Environ 0,671 kW d’économie de puissance active.')]},
{id:6,name:'Armoire sous contrôle',duration:45,desc:'Vérifier composants, protections et réglages.',topic:'Contacteur et relais thermique',lesson:'Q1 protège ici des courts-circuits, KM1 est le contacteur, F1 un relais thermique en ligne, M1 le moteur. Un relais thermique contre surcharge ne remplace pas la protection court-circuit. Réglage initial de référence : In plaque, selon notice constructeur.',training:[Q('M6-01','Appareil de manœuvre','Quel appareil établit et coupe le circuit de puissance sur ordre électrique ?',['Sectionneur simple','Contacteur','Relais thermique','Moteur'],1,'Il possède une bobine A1-A2.','KM1.','Le contacteur.'),Q('M6-03','Relais thermique','Contre quoi protège-t-il principalement ?',['Court-circuit seulement','Surcharge prolongée','Surtension réseau','Défaut logiciel'],1,'L’échauffement lié à l’excès de courant.','Surcharge prolongée.','Le relais thermique sert à protéger contre les surcharges.')],challenges:[Q('M6-05','Fonctions Q1','Dans ce départ, Q1 est le disjoncteur magnétique. Quelle fonction assure-t-il ?',['Commande Marche','Protection court-circuit','Mesure du rendement','Couplage étoile'],1,'Protection en amont.','Court-circuit.','Q1 traite les courts-circuits dans ce montage.'),N('M6-06','Réglage thermique','Moteur In 11 A, relais thermique en ligne 9–13 A : réglage initial de référence en A ?',11,'Réglage lié au courant plaque.','11 A sous réserve de notice.','11 A ; réglage 13 A excessif pour la référence choisie.'),Q('M6-07','Choisir le relais','Quelle plage convient à un réglage initial à 11 A ?',['5,5–8 A','9–13 A','14–18 A','6–10 A'],1,'La plage doit englober 11 A.','9 à 13.','Le relais 9–13 A est une présélection cohérente.'),Q('M6-08','Relevés de courant','Mesures 12,8 A / 13 A / 12,7 A avec In=11 A. Que conclure ?',['Fonctionnement nominal certain','Surintensité constatée ; cause à rechercher','Court-circuit certain','Bobine HS certaine'],1,'Comparer aux 11 A nominaux.','Les trois courants sont supérieurs.','Dépassement nominal, investigations nécessaires sans cause unique.')]},
{id:7,name:'Le schéma de l’Ombre',duration:65,desc:'Résoudre le sabotage de la commande moteur.',topic:'Commande, auto-maintien, diagnostic',lesson:'S0 arrêt NF, S1 marche NO ; F1 95-96 NF ; bobine KM1 A1-A2. Le contact NO KM1 13-14, en parallèle de S1, permet l’auto-maintien. Pour un inverseur, verrouiller KM1/KM2 afin d’empêcher la fermeture simultanée.',training:[Q('M7-01','Contact de Marche','Quel est généralement l’état du bouton Marche au repos ?',['NF','NO','Toujours alimenté','Indéfini'],1,'Il ferme au moment de l’appui.','Normalement ouvert.','S1 est NO au repos.'),Q('M7-04','Sans auto-maintien','Sans contact de maintien, que fait KM1 au relâchement de S1 ?',['Reste collé','Retombe','Inverse le moteur','Disjoncte toujours'],1,'Le bouton NO revient ouvert.','Plus de chemin de courant vers la bobine.','KM1 retombe.')],challenges:[Q('M7-06','Bobine KM1','Quels repères identifient la bobine d’un contacteur standard ?',['95-96','A1-A2','13-14','L1-L2'],1,'Ce sont les bornes de commande de la bobine.','A1 et A2.','A1-A2 désignent la bobine.'),Q('M7-07','Branche de maintien','Où placer le contact auxiliaire NO KM1 13-14 ?',['En parallèle de S1','En parallèle de S0','En série avec M1','En court-circuit de F1'],0,'Le contact remplace temporairement Marche après relâchement.','En parallèle de S1.','Le contact auxiliaire assure l’auto-maintien sans contourner l’arrêt.'),Q('M7-08','Inverseur','À quoi sert l’interverrouillage KM1/KM2 ?',['Accélérer le moteur','Empêcher simultanéité','Augmenter cosφ','Mesurer le courant'],1,'Les deux sens ne doivent pas se fermer ensemble.','Éviter un court-circuit entre phases.','Un verrouillage électrique et mécanique approprié évite la fermeture simultanée.'),Q('M7-09','BOSS : maintenu, puis retombé','Sous 24 V, KM1 colle seulement tant que S1 est appuyé. Priorité de vérification ?',['Rotor brisé certain','Branche KM1 13-14 / liaisons','Fréquence nulle certaine','Fusible puissance forcément fondu'],1,'Bobine fonctionne sous appui.','Contrôler le chemin de maintien.','Hypothèse plausible : contact auxiliaire ou liaison du maintien défectueux.')]}
];

{title:'E4 — Départ moteur',time:15,context:'Q1 disjoncteur magnétique, KM1 contacteur, F1 relais thermique en ligne, M1 moteur In=11 A. Relais réglable 9–13 A, actuellement réglé 13 A. Courants 12,8/13,0/12,7 A.',questions:[Q('E4.1','Appareillage','Quel organe assure la manœuvre normale du moteur ?',['Q1','KM1','F1','M1'],1,'Il possède une bobine.','KM1.','Le contacteur KM1 commande le départ.'),Q('E4.2','Thermique','Quel rôle assure F1 ?',['Détection de surcharge','Compensation du cosφ','Mise en étoile','Alimentation 24 V'],0,'Ce n’est pas une protection court-circuit.','Surintensités prolongées.','F1 détecte une surcharge et ouvre la chaîne de commande via son contact auxiliaire.'),N('E4.3','Réglage initial','Valeur de référence en A pour F1 monté en ligne ?',11,'Courant nominal plaque.','In=11 A.','11 A sous réserve de la notice constructeur.'),Q('E4.4','Courants relevés','Quelle conclusion est justifiée ?',['Aucun écart','Surintensité vs In et enquête nécessaire','Court-circuit garanti','Moteur définitivement HS'],1,'Comparer chaque mesure à 11 A.','Toutes dépassent In.','Courants supérieurs au nominal ; cause non établie.')]},
{title:'E5 — Diagnostic de commande',time:20,context:'Commande 24 V DC ; S0 arrêt NF fermé, S1 Marche NO, F1 95–96 NF fermé, bobine KM1. En maintenant S1 : KM1 colle avec 24 V A1–A2 ; après relâchement : KM1 retombe, 0 V A1–A2.',questions:[Q('E5.1','Bouton Arrêt','S0, état au repos :',['NO','NF','Bobine','Relais'],1,'L’arrêt ouvre la chaîne.','Normalement fermé.','S0 est NF.'),Q('E5.2','Auto-maintien','Quel composant maintient KM1 après relâchement de S1 ?',['KM1 13–14 NO','Q1 magnétique','Moteur','PE'],0,'Contact parallèle à Marche.','KM1 13–14.','Le contact auxiliaire KM1 13–14 réalise le maintien.'),Q('E5.3','Interprétation','Que montrent les relevés ?',['Bobine toujours alimentée','Perte de l’alimentation bobine après relâchement','Court-circuit garanti','S0 forcément ouvert'],1,'24 V sous appui, puis 0 V.','Chemin de maintien suspect.','La tension de commande disparaît au relâchement.'),Q('E5.4','Hypothèses','Quelle cause est compatible ?',['Défaut contact auxiliaire / liaison maintien','Rotor cassé certain','Neutre du moteur coupé certain','Surfréquence certaine'],0,'Ne pas conclure au-delà des relevés.','Examine 13–14.','Une rupture de branche de maintien est possible.'),Q('E5.5','Contrôle sûr','Quelle démarche convient pour contrôler la branche ?',['Shunter S0 sous tension','Contrôle adapté après consignation/VAT par habilité','Forcer KM1 mécaniquement','Supprimer F1'],1,'Sécurité avant contrôle.','Consignation et habilitation.','Intervention selon procédure de sécurité, par personnel habilité.')]}

ement :","options":["1–2","97–98","A1–A2","PE"],"domain":"Protections","difficulty":"Difficile","price":100,"minutes":2},{"id":"F-027","title":"Sectionnement","prompt":"Un sectionneur simple :","options":["Remplace toujours disjoncteur","Détecte surcharge","Sépare électriquement, sans protection auto","Coupe toute charge indifféremment"],"domain":"Protections","difficulty":"Facile","price":100,"minutes":2},{"id":"F-028","title":"Commande Marche","prompt":"Un bouton Marche classique au repos est :","options":["NO","NF","Toujours fermé","Toujours sous tension"],"domain":"Commande","difficulty":"Intermédiaire","price":100,"minutes":1},{"id":"F-029","title":"Auto-maintien","prompt":"Fonction d’un contact KM1 13–14 parallèle au bouton Marche :","options":["Court-circuit","Maintenir la bobine","Inverser deux phases","Supprimer Arrêt"],"domain":"Commande","difficulty":"Difficile","price":100,"minutes":2},{"id":"F-030","title":"Deux postes","prompt":"Deux boutons Marche NO pour commander depuis deux postes sont généralement :","options":["En série","En parallèle","Sur deux phases","À la place de F1"],"domain":"Commande","difficulty":"Facile","price":100,"minutes":2},{"id":"F-031","title":"Courant série","prompt":"En série, deux résistances ont un courant :","options":["Différent","Identique","Nul","Double"],"domain":"Fondamentaux","difficulty":"Intermédiaire","price":100,"minutes":1},{"id":"F-032","title":"Milliampère","prompt":"250 mA correspond à :","options":["0,025 A","0,25 A","2,5 A","25 A"],"domain":"Fondamentaux","difficulty":"Difficile","price":100,"minutes":2},{"id":"F-033","title":"Résistances en parallèle","prompt":"Deux 100 Ω en parallèle : Req ?","options":["200 Ω","100 Ω","50 Ω","25 Ω"],"domain":"Fondamentaux","difficulty":"Facile","price":100,"minutes":2},{"id":"F-034","title":"Ampèremètre","prompt":"Ampèremètre de faible résistance placé directement sur source : risque ?","options":["Forte surintensité","Meilleure tension","Résistance augmente","Sans danger"],"domain":"Fondamentaux","difficulty":"Intermédiaire","price":100,"minutes":1},{"id":"F-035","title":"Conversion puissance","prompt":"2,5 kW correspond à :","options":["25 W","250 W","2500 W","25000 W"],"domain":"Puissances","difficulty":"Difficile","price":100,"minutes":2},{"id":"F-036","title":"Énergie active","prompt":"2 kW constants pendant trois heures :","options":["6 kWh","6 kW","0,67 kWh","5 kWh"],"domain":"Puissances","difficulty":"Facile","price":100,"minutes":2},{"id":"F-037","title":"Facteur P/S","prompt":"P=4 kW, S=5 kVA : cosφ ?","options":["1,25","0,8","0,2","9"],"domain":"Puissances","difficulty":"Intermédiaire","price":100,"minutes":1},{"id":"F-038","title":"Bilan compensé","prompt":"P1=3, Q1=+4 ; P2=3, Q2=−4 en k-unités : Stotal ?","options":["10 kVA","6 kVA","14 kVA","0 kVA"],"domain":"Puissances","difficulty":"Difficile","price":100,"minutes":2},{"id":"F-039","title":"Triangle et tension","prompt":"Couplage triangle sur U=400 V : tension de chaque enroulement ?","options":["230 V","400 V","690 V","0"],"domain":"Triphasé","difficulty":"Facile","price":100,"minutes":2},{"id":"F-040","title":"Étoile et courant","prompt":"Couplage étoile équilibré, I de ligne=8 A : I enroulement ?","options":["8 A","4,62 A","13,86 A","24 A"],"domain":"Triphasé","difficulty":"Intermédiaire","price":100,"minutes":1},{"id":"F-041","title":"Couplage inadapté","prompt":"Moteur 230/400 Δ/Y couplé triangle sur 400 V :","options":["Normal","Enroulement 230 V","Enroulement 400 V au lieu de 230 V","Hors tension"],"domain":"Triphasé","difficulty":"Difficile","price":100,"minutes":2},{"id":"F-042","title":"Rotor à cage","prompt":"Courant dans le rotor à cage créé par :","options":["Induction électromagnétique","Pile","Neutre direct","Roulements"],"domain":"Moteurs","difficulty":"Facile","price":100,"minutes":2},{"id":"F-043","title":"Nombre de pôles","prompt":"50 Hz et ns=750 tr/min : combien de pôles ?","options":["2","4","6","8"],"domain":"Moteurs","difficulty":"Intermédiaire </script><script>'use strict';
const KEY='blackout-industry-v01';
const blank=()=>({profile:{name:'',first:'',team:'',session:'NEXUS-2026'},missionResults:{},missionDraft:{},exam:{startedAt:null,stage:0,answers:{},hints:{},complete:false,completedAt:null},shopBought:[],arsenal:null,screen:'home'});
let state;try{state=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{state=blank()}
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;
const fmt=n=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:2});
const nval=s=>{const x=Number(String(s??'').trim().replace(/\s/g,'').replace(',','.'));return Number.isFinite(x)?x:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('save-status').textContent='✓'}catch{toast('Stockage local indisponible : les progrès risquent de ne pas être conservés.')}}
let toastT;function toast(msg){let e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),3300)}
const passed=()=>Object.keys(state.missionResults).length;
const earned=()=>Object.values(state.missionResults).reduce((s,x)=>s+x.score,0);
const balance=()=>earned()-state.shopBought.length*100;
const allDone=()=>passed()===7;
const examAllowed=()=>allDone();
const shopAllowed=()=>state.exam.complete;
function goto(screen){state.screen=screen;save();render();window.scrollTo({top:0,behavior:'instant'});}
function isUnlocked(id){return id===1||!!state.missionResults[id-1]||!!state.missionResults[id]}
function nav(){const items=missions.map(m=>`<button class="nav-item ${state.screen==='m'+m.id?'active':''} ${!isUnlocked(m.id)?'locked':''}" data-nav="m${m.id}"><span class="nav-number">${state.missionResults[m.id]?'✓':String(m.id).padStart(2,'0')}</span><span>${esc(m.name)}</span></button>`).join('');$('nav').innerHTML=`<button class="nav-item ${state.screen==='home'?'active':''}" data-nav="home"><span class="nav-number">⌂</span><span>Tableau de bord</span></button>`+items;$('nav-secondary').innerHTML=`<button class="nav-item ${state.screen==='exam'?'active':''} ${!examAllowed()?'locked':''}" data-nav="exam"><span class="nav-number">✎</span><span>BLACKOUT FINAL</span></button><button class="nav-item ${state.screen==='shop'?'active':''} ${!shopAllowed()?'locked':''}" data-nav="shop"><span class="nav-number">◈</span><span>Boutique de l'Ombre</span></button><button class="nav-item ${state.screen==='reports'?'active':''}" data-nav="reports"><span class="nav-number">▤</span><span>Mes bilans</span></button>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let p=b.dataset.nav;if(p.startsWith('m')&&!isUnlocked(Number(p.slice(1))))return toast('Termine d’abord la mission précédente.');if(p==='exam'&&!examAllowed())return toast('Les 7 missions doivent être terminées.');if(p==='shop'&&!shopAllowed())return toast('Termine BLACKOUT FINAL avant la boutique.');goto(p)})}
function speaker(who,text){return `<div class="speaker ${who==='ombre'?'shadow':''}"><img src="${who==='ombre'?'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23251434%22/%3E%3Cpath d=%22M20 75L34 20 66 20 80 75 60 66 50 90 40 66Z%22 fill=%22%23814dd0%22/%3E%3Ccircle cx=%2237%22 cy=%2247%22 r=%226%22 fill=%22%23f7a6ff%22/%3E%3Ccircle cx=%2263%22 cy=%2247%22 r=%226%22 fill=%22%23f7a6ff%22/%3E%3C/svg%3E':'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%230d2840%22/%3E%3Crect x=%2223%22 y=%2225%22 width=%2254%22 height=%2250%22 rx=%2212%22 fill=%22%230d829d%22 stroke=%22%2330e3e6%22 stroke-width=%224%22/%3E%3Ccircle cx=%2238%22 cy=%2245%22 r=%226%22 fill=%22%23d9ffff%22/%3E%3Ccircle cx=%2262%22 cy=%2245%22 r=%226%22 fill=%22%23d9ffff%22/%3E%3Cpath d=%22M35 61Q50 71 65 61%22 stroke=%22%23d9ffff%22 stroke-width=%224%22 fill=%22none%22/%3E%3C/svg%3E'}" alt="${who==='ombre'?"L’Ombre":"VOLT-X"}"><div class="line"><strong>${who==='ombre'?'L’OMBRE · SABOTEUR':'VOLT-X · ASSISTANT TECHNIQUE'}</strong><p>${esc(text)}</p></div></div>`}
function header(k,h,p=''){return `<div class="page-head"><div class="kicker">${esc(k)}</div><h1>${esc(h)}</h1><p>${esc(p)}</p></div>`}
function home(){let complete=passed();return `<section class="hero"><div><div class="eyebrow">ϟ OPÉRATION NEXUS INDUSTRIES</div><h1>REPRENEZ LE <span>CONTRÔLE.</span></h1><p>7 secteurs sabotés. Un robot pour t'aider. Une ombre qui veut te voir échouer. Rétablis l'usine et prépare ton BLACKOUT FINAL.</p><div class="actions"><button class="btn" data-do="continue">${complete===7?'Voir le BLACKOUT FINAL':'Poursuivre la campagne'} →</button><button class="btn alt" data-nav="reports">Mes résultats</button></div></div></section><div class="stats"><div class="stat"><div class="label">MISSIONS TERMINÉES</div><strong>${complete}/7</strong><div class="progress"><div style="width:${100*complete/7}%"></div></div></div><div class="stat"><div class="label">CRÉDITS GAGNÉS</div><strong>${fmt(earned())}</strong><div class="mini">maximum 7 000 CE</div></div><div class="stat"><div class="label">ÉPREUVE FINALE</div><strong>${state.exam.complete?fmt(scoreExam().score)+'/20':'75 min'}</strong><div class="mini">5 études · 20 questions</div></div><div class="stat"><div class="label">BOUTIQUE</div><strong>${state.shopBought.length}/50</strong><div class="mini">questions achetées</div></div></div><div class="section-heading"><h2>Carte des secteurs</h2><span class="tag">Débloqués dans l'ordre</span></div><div class="mission-grid">${missions.map(m=>`<div class="mission-card ${!isUnlocked(m.id)?'disabled':''}"><div class="topline"><span class="kicker">MISSION ${String(m.id).padStart(2,'0')}</span><span class="pill ${state.missionResults[m.id]?'done':''}">${state.missionResults[m.id]?'RÉTABLIE':isUnlocked(m.id)?'DISPONIBLE':'VERROUILLÉE'}</span></div><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p><div class="tag">◷ ${m.duration} min · jusqu’à 1 000 CE ${state.missionResults[m.id]?'· '+fmt(state.missionResults[m.id].score)+' CE':''}</div><div class="actions"><button class="btn ${isUnlocked(m.id)?'alt':'flat'}" ${!isUnlocked(m.id)?'disabled':''} data-nav="m${m.id}">${state.missionResults[m.id]?'Consulter':'Entrer dans la mission'}</button></div></div>`).join('')}</div><div class="notice">Prototype V0.1 : la campagne propose 40 activités jouables essentielles, parmi les 105 fiches du cahier des charges. Les exercices supplémentaires, les schémas normalisés et les fonctions avancées restent à intégrer. Les notes sont stockées uniquement sur cet appareil.</div>`}
function ensureDraft(id){if(!state.missionDraft[id])state.missionDraft[id]={step:'intro',training:0,ch:0,answers:{},hints:{},startedAt:Date.now(),result:null};return state.missionDraft[id]}
function questionHTML(q,prefix,allowHints=true){let key=prefix+q.id,selected=state.missionDraftCurrent?.answers?.[key];return `<div class="question"><span class="number">${esc(q.id)}</span><h3>${esc(q.t)}</h3><p>${esc(q.p)}</p>${q.type==='choice'?`<div class="opts">${q.options.map((o,i)=>`<button class="opt ${String(selected)===String(i)?'selected':''}" data-pick="${attr(key)}" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`:`<label class="field" for="val-${attr(q.id)}">Réponse numérique (unités indiquées dans la question)</label><input id="val-${attr(q.id)}" class="answer-input" inputmode="decimal" type="text" value="${attr(selected??'')}" data-input="${attr(key)}" placeholder="Saisir un nombre (ex. 6,25)">`}${allowHints?`<div class="actions"><button class="btn flat" data-hint="${attr(key)}" ${((state.missionDraftCurrent?.hints?.[key])||0)>=2?'disabled':''}>💡 Indice ${(state.missionDraftCurrent?.hints?.[key]||0)+1}/2</button></div>${state.missionDraftCurrent?.hints?.[key]?`<div class="hintbox">${esc(q.h1)}${state.missionDraftCurrent.hints[key]>1?' — '+esc(q.h2):''}</div>`:''}`:''}</div>`}
function questionCorrect(q,a){if(a===null||a===undefined||String(a).trim()==='')return false;if(q.type==='choice')return Number(a)===q.a;let x=nval(a);return x!==null&&Math.abs(x-q.a)<=Math.max(.015,Math.abs(q.a)*.012)}
function mission(id){let m=missions.find(x=>x.id===id);if(state.missionResults[id]){let r=state.missionResults[id];return header('Secteur restauré · Mission '+id,m.name,'Tu peux consulter tes résultats, mais les CE de cette mission ne peuvent pas être gagnés une seconde fois.')+`<div class="stats"><div class="stat"><div class="label">CRÉDITS</div><strong>${fmt(r.score)}</strong></div><div class="stat"><div class="label">RÉUSSITE</div><strong>${r.correct}/${r.total}</strong></div><div class="stat"><div class="label">TEMPS</div><strong>${fmt(r.minutes)} min</strong></div></div>${speaker('voltx','Zone restaurée ! Revois les corrections dans ton bilan de mission.')}${r.details.map(d=>`<div class="card"><strong>${esc(d.id)} — ${esc(d.title)}</strong><p class="small muted">Ta réponse : ${esc(d.given)}</p><div class="answer-feedback ${d.ok?'':'bad'}">${esc(d.ex)}</div></div>`).join('')}<div class="actions"><button class="btn" data-do="continue">Continuer →</button><button class="btn alt" data-nav="reports">Voir le bilan</button></div>`}
let d=ensureDraft(id);state.missionDraftCurrent=d;let p=header(`MISSION ${String(id).padStart(2,'0')} · ${m.duration} MIN`,m.name,m.desc);if(d.step==='intro')return p+speaker('ombre',['','J’ai coupé le 24 V. Les volts vont-ils enfin trouver leur chemin ?','J’ai mélangé les watts, vars et voltampères.','Étoile ou triangle ? Bonne chance avec les barrettes.','Le moteur ralentit… et ton diagnostic aussi ?','Mon moteur à 167 % de rendement est une merveille.','J’ai réglé la protection au maximum. Plus d’ennuis !','J’ai coupé la branche de maintien. Attrape-moi !'][id])+speaker('voltx','Objectif : '+m.desc+' Je t’explique les principes avant l’entraînement. Les défis classés donneront des Crédits Énergie.')+`<div class="panel"><h3>🎯 Objectif de compétence</h3><p class="subtle">${esc(m.topic)}</p><p class="tag">${m.training.length} entraînements guidés • ${m.challenges.length} défis classés • 1 000 CE maximum</p></div><div class="actions"><button class="btn" data-mission-step="lesson">Ouvrir le cours →</button></div>`;
if(d.step==='lesson')return p+`<div class="lesson"><h3>📘 Capsule de cours · VOLT-X</h3><p>${esc(m.lesson)}</p><p class="small muted">Lis la capsule, puis applique-la aux situations industrielles proposées. Les réponses aux entraînements seront expliquées après validation.</p></div>`+speaker('voltx','Tu peux revoir ce cours pendant la mission. Comprendre la méthode vaut mieux que deviner la bonne case.')+`<div class="actions"><button class="btn" data-mission-step="training">Démarrer les entraînements →</button><button class="btn alt" data-mission-step="intro">Retour</button></div>`;
if(d.step==='training'){let q=m.training[d.training];if(!q){d.step='challenge';save();return mission(id)}let key='T'+q.id,a=d.answers[key],hasResponse=a!==undefined&&a!=='';let validated=!!d.answers['done-'+key],isOk=questionCorrect(q,a);return p+`<div class="tabs"><span class="pill">ENTRAÎNEMENT ${d.training+1}/${m.training.length}</span><span class="tag">Sans crédits • correction immédiate</span></div><div class="lesson small"><b>Rappel :</b> ${esc(m.lesson)}</div>${questionHTML(q,'T',false)}${validated?`<div class="answer-feedback ${isOk?'':'bad'}">${isOk?'✓ Bonne réponse.':'✕ À revoir.'} ${esc(q.ex)}</div>`:''}<div class="actions">${!validated?`<button class="btn" data-train-check ${!hasResponse?'disabled':''}>Vérifier ma réponse</button>`:`<button class="btn" data-train-next>${d.training+1===m.training.length?'Passer aux défis classés →':'Question suivante →'}</button>`}<button class="btn alt" data-mission-step="lesson">Relire le cours</button></div>`}
if(d.step==='challenge'){let q=m.challenges[d.ch];if(!q){finalizeMission(id);return mission(id)}let key='C'+q.id,a=d.answers[key],hasResponse=a!==undefined&&a!=='';return p+`<div class="exam-head"><span class="pill purple">DÉFI CLASSÉ ${d.ch+1}/${m.challenges.length}</span><span class="tag">⚡ 1 000 CE au total</span></div><div class="progress" style="margin:16px 0"><div style="width:${100*d.ch/m.challenges.length}%"></div></div>${questionHTML(q,'C',true)}<div class="notice">Après validation, cette réponse est verrouillée. La correction complète apparaîtra en fin de mission. Un indice diminue les crédits d’autonomie.</div><div class="actions"><button class="btn" data-challenge-next ${!hasResponse?'disabled':''}>Valider la réponse ${d.ch+1===m.challenges.length?'et terminer':'et continuer →'}</button><button class="btn alt" data-mission-step="lesson">Relire le cours</button></div>`}
return p}
function finalizeMission(id){let m=missions.find(x=>x.id===id),d=ensureDraft(id),n=m.challenges.length,details=m.challenges.map(q=>{let key='C'+q.id,answer=d.answers[key];return {id:q.id,title:q.t,given:answer===undefined?'Non répondu':q.type==='choice'?(q.options[Number(answer)]||'Non répondu'):answer,ok:questionCorrect(q,answer),ex:q.ex,hints:d.hints[key]||0}});let correct=details.filter(x=>x.ok).length,tech=600*correct/n,method=200*correct/n,autonomy=details.reduce((s,x)=>s+(x.hints===0?100/n:x.hints===1?60/n:0),0),minutes=(Date.now()-d.startedAt)/60000,speed=correct/n>=.7?100*Math.max(0,1-Math.max(0,minutes-6)/(m.duration-6)):0;let score=Math.max(0,Math.min(1000,Math.round(tech+method+autonomy+speed)));state.missionResults[id]={score,correct,total:n,minutes:Math.round(minutes*10)/10,details};delete state.missionDraft[id];save();toast('Mission terminée : +'+score+' CE !')}
function ensureExam(){state.exam=state.exam||blank().exam;return state.exam}
function examRemaining(){return Math.max(0,75*60-Math.floor((Date.now()-(state.exam.startedAt||Date.now()))/1000))}
function renderExam(){let e=ensureExam();if(!examAllowed())return header('ÉPREUVE INDIVIDUELLE','BLACKOUT FINAL')+`<div class="empty">Les 7 missions doivent être terminées pour débloquer l'épreuve.</div>`;if(e.complete)return examReview();if(!e.startedAt)return header('ÉVALUATION INDIVIDUELLE · 75 MIN','BLACKOUT FINAL','Cinq études indépendantes, 20 questions notées sur 20. Le chronomètre global démarre au lancement.')+`<div class="panel"><h3>Règles de l'épreuve</h3><p class="subtle">Tu peux naviguer entre les questions de l’étude en cours, laisser une réponse vide, puis valider l’étude. Une fois validée, tu ne peux plus la modifier. L’étude suivante s’ouvre alors. Les corrections et la note restent masquées jusqu’à la clôture.</p><p class="subtle">Aide 1 : coefficient 0,90 sur les points obtenus à cette question. Aides 1 et 2 : coefficient 0,75. Sans aide : 1,00.</p><p class="subtle">Le temps continue à courir si tu actualises la page. Il n’y a aucune garantie anti-triche sans serveur.</p><div class="actions"><button class="btn" data-exam-start>⚡ Lancer l’épreuve de 75 minutes</button></div></div>`;
let stage=exam[e.stage];if(!stage){finalizeExam();return examReview()}let rem=examRemaining();if(rem<=0){finalizeExam();return examReview()}let mins=Math.floor(rem/60),secs=rem%60;let html=header('BLACKOUT FINAL · ÉTUDE '+(e.stage+1)+' SUR 5',stage.title,stage.context)+`<div class="panel"><div class="exam-head"><span class="pill purple">ÉTUDE ${e.stage+1}/5 · ${stage.time} MIN CONSEILLÉES</span><span id="countdown" class="timer ${rem<=300?'urgent':''}">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</span></div><div class="progress" style="margin:13px 0"><div style="width:${100*e.stage/5}%"></div></div><div class="small muted">Documents de l'étude accessibles en permanence ci-dessus ; les valeurs restent visibles pendant la saisie.</div></div>`;
for(const q of stage.questions){let a=e.answers[q.id];html+=`<div class="question"><div class="number">${esc(q.id)} • 1 POINT</div><h3>${esc(q.t)}</h3><p>${esc(q.p)}</p>${q.type==='choice'?`<div class="opts">${q.options.map((o,i)=>`<button class="opt ${String(a)===String(i)?'selected':''}" data-exam-choice="${attr(q.id)}" data-value="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`:`<label class="field">Réponse numérique</label><input class="answer-input" type="text" inputmode="decimal" data-exam-number="${attr(q.id)}" value="${attr(a??'')}" placeholder="Ex. 2,67">`}<div class="actions"><button class="btn flat" data-exam-hint="${attr(q.id)}" ${(e.hints[q.id]||0)>=2?'disabled':''}>💡 ${e.hints[q.id]||0}/2 indices utilisés</button></div>${(e.hints[q.id]||0)>0?`<div class="hintbox">${esc(q.h1)}${e.hints[q.id]>1?' — '+esc(q.h2):''}</div>`:''}</div>`}
let blanks=stage.questions.filter(q=>e.answers[q.id]===undefined||e.answers[q.id]==='').length;html+=`<div class="notice">${blanks} réponse(s) non renseignée(s). Tu peux soumettre l’étude avec des blancs : ils compteront pour 0 point. La validation est irréversible.</div><div class="actions"><button class="btn" data-exam-submit>${e.stage===4?'Terminer l’épreuve':'Valider cette étude et poursuivre →'}</button></div>`;return html}
function scoreExam(){let parts=[],total=0;for(const s of exam){for(const q of s.questions){let given=state.exam.answers[q.id],ok=questionCorrect(q,given),h=state.exam.hints[q.id]||0,coef=h===0?1:h===1?.9:.75,pt=ok?coef:0;total+=pt;parts.push({q,s,ok,h,coef,pt,given})}}return {score:Math.round(total*100)/100,parts}}
function finalizeExam(){if(state.exam.complete)return;state.exam.complete=true;state.exam.completedAt=Date.now();save();toast('Épreuve clôturée : bilan disponible.')}
function examReview(){let r=scoreExam(),e=state.exam;return header('ÉPREUVE TERMINÉE','Bilan individuel BLACKOUT FINAL','Toutes les corrections sont désormais accessibles. Ce bilan peut être exporté via l’impression PDF du navigateur.')+`<div class="stats"><div class="stat"><div class="label">NOTE INDIVIDUELLE</div><strong>${fmt(r.score)}/20</strong></div><div class="stat"><div class="label">BONNES RÉPONSES</div><strong>${r.parts.filter(x=>x.ok).length}/20</strong></div><div class="stat"><div class="label">INDICES UTILISÉS</div><strong>${r.parts.reduce((s,x)=>s+x.h,0)}</strong></div><div class="stat"><div class="label">DURÉE</div><strong>${e.startedAt?fmt(Math.min(75,(e.completedAt-e.startedAt)/60000)):0} min</strong></div></div>${speaker('voltx',r.score>=15?'Bravo ! De nombreux acquis sont solides. Analyse les erreurs restantes pour progresser.':r.score>=10?'Des acquis sont présents, mais plusieurs compétences sont à renforcer avec les corrections.':'Le bilan repère des difficultés. Reprends les capsules de cours avant un nouvel entraînement.')}${r.parts.map(x=>`<div class="card" style="margin:10px 0"><div class="tag">${esc(x.q.id)} · ${fmt(x.pt)} / 1 pt · ${x.h} indice(s)</div><h3>${esc(x.q.t)} ${x.ok?'✓':'✕'}</h3><p class="small muted">Réponse : ${esc(x.given===undefined||x.given===''?'Non répondu':x.q.type==='choice'?x.q.options[Number(x.given)]:x.given)}</p><div class="answer-feedback ${x.ok?'':'bad'}">${esc(x.q.ex)}</div></div>`).join('')}<div class="actions"><button class="btn" data-print="exam">🖨 Exporter mon bilan PDF</button><button class="btn purple" data-nav="shop">Accéder à la boutique →</button></div><div class="notice">Préversion V0.1 : la correction numérique est automatique ; les justifications complexes et validations formateur ne sont pas encore implémentées. La note n'est pas certifiée par un serveur.</div>`}
function shopPage(){if(!shopAllowed())return header('BOUTIQUE DE L’OMBRE','Arsenal verrouillé','Termine le BLACKOUT FINAL pour acheter les questions Flash.')+`<div class="empty">⚑ La boutique s’ouvre après l’évaluation individuelle.</div>`;return header('BOUTIQUE DE L’OMBRE','Le marché noir des questions','50 questions Flash, toutes à 100 CE. Les achats ne modifient pas les crédits déjà gagnés pour ton classement.')+speaker('ombre','Des questions pour écraser les équipes adverses ! Choisis-les avec soin : après l’export final, ta sélection sera figée.')+`<div class="stats"><div class="stat"><div class="label">SOLDE DISPONIBLE</div><strong>${fmt(balance())} CE</strong></div><div class="stat"><div class="label">ACHETÉES</div><strong>${state.shopBought.length}/50</strong></div><div class="stat"><div class="label">COÛT D’UNE FLASH</div><strong>100 CE</strong></div><div class="stat"><div class="label">ARSENAL</div><strong>${state.arsenal?'FIGÉ':'OUVERT'}</strong></div></div><div class="panel"><div class="field-row"><div><label>Domaine</label><select id="shop-domain"><option value="all">Tous les domaines</option>${[...new Set(shop.map(q=>q.domain))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div><label>Difficulté</label><select id="shop-difficulty"><option value="all">Toutes</option><option>Facile</option><option>Intermédiaire</option><option>Difficile</option></select></div></div><p class="small muted">Les titres et domaines sont visibles avant achat ; les questions complètes se dévoilent après achat.</p></div><div class="section-heading"><h2>Catalogue Flash</h2><span class="tag" id="shop-count">50 questions</span></div><div class="shop-grid" id="shop-grid"></div><div class="section-heading"><h2>Mon Arsenal (${state.shopBought.length})</h2></div>${state.shopBought.length?`<div class="panel">${state.shopBought.map(id=>{let q=shop.find(x=>x.id===id);return `<div style="padding:12px 0;border-bottom:1px solid var(--border)"><strong>${esc(id)} — ${esc(q.title)}</strong><p class="small">${esc(q.prompt)}</p><div class="small muted">${q.options.map((x,i)=>'ABCD'[i]+'. '+esc(x)).join(' · ')}</div></div>`}).join('')}</div>`:`<div class="empty">Aucune question achetée pour l'instant.</div>`}<div class="actions">${state.arsenal?`<button class="btn" data-print="arsenal">🖨 Réimprimer le même Arsenal</button>`:`<button class="btn purple" data-freeze ${!state.shopBought.length?'disabled':''}>Figer l'Arsenal et exporter en PDF</button>`}</div><div class="notice">L’export utilise « Imprimer → Enregistrer au format PDF ». Une fois figé, l’Arsenal ne peut plus être modifié dans cette session. Le PDF reste sans correction.</div>`}
function shopFilter(){let domain=$('shop-domain')?.value||'all',difficulty=$('shop-difficulty')?.value||'all';let rows=shop.filter(x=>(domain==='all'||domain===x.domain)&&(difficulty==='all'||difficulty===x.difficulty));$('shop-count').textContent=rows.length+' questions';$('shop-grid').innerHTML=rows.map(q=>{let bought=state.shopBought.includes(q.id);return `<div class="shop-item"><div class="kicker">${esc(q.id)} · ${esc(q.domain)}</div><h3>${esc(q.title)}</h3><p>${esc(q.difficulty)} · ${q.minutes} min · 2 points bruts</p>${bought?`<p class="small">${esc(q.prompt)}</p>`:`<p>Question accessible après achat ; détails conservés dans ton Arsenal.</p>`}<div class="bottom"><strong style="color:var(--gold)">⚡ 100 CE</strong><button class="btn ${bought?'alt':''}" data-buy="${esc(q.id)}" ${bought||state.arsenal||balance()<100?'disabled':''}>${bought?'✓ Achetée':state.arsenal?'Arsenal figé':'Acheter'}</button></div></div>`}).join('')}
function reports(){return header('RÉSULTATS & EXPORTS','Mes bilans','Tu peux imprimer les rapports et les enregistrer en PDF depuis le navigateur.')+`<div class="stats"><div class="stat"><div class="label">CRÉDITS HISTORIQUES</div><strong>${fmt(earned())}</strong></div><div class="stat"><div class="label">SOLDE BOUTIQUE</div><strong>${fmt(balance())}</strong></div><div class="stat"><div class="label">MISSIONS FINIES</div><strong>${passed()}/7</strong></div><div class="stat"><div class="label">NOTE FINALE</div><strong>${state.exam.complete?fmt(scoreExam().score)+'/20':'—'}</strong></div></div><div class="panel"><h3>Identification du rapport</h3><div class="field-row"><div><label>Nom</label><input id="profile-name" type="text" value="${attr(state.profile.name)}" placeholder="Nom"></div><div><label>Prénom</label><input id="profile-first" type="text" value="${attr(state.profile.first)}" placeholder="Prénom"></div><div><label>Équipe</label><input id="profile-team" type="text" value="${attr(state.profile.team)}" placeholder="Équipe A"></div><div><label>Session</label><input id="profile-session" type="text" value="${attr(state.profile.session)}"></div></div><button class="btn alt" data-save-profile>✓ Enregistrer l'identité</button></div><div class="section-heading"><h2>Rapports</h2></div><div class="mission-grid"><div class="card"><h3>① Bilan des sept missions</h3><p class="subtle">Crédits, réussites, erreurs et corrections, par mission.</p><button class="btn" data-print="missions" ${passed()===0?'disabled':''}>Exporter en PDF</button></div><div class="card"><h3>② BLACKOUT FINAL</h3><p class="subtle">Note sur 20, temps, indices, réponses et corrigés après clôture.</p><button class="btn" data-print="exam" ${!state.exam.complete?'disabled':''}>Exporter en PDF</button></div><div class="card"><h3>③ Arsenal Flash</h3><p class="subtle">Questions achetées, sans corrigés, avec identité et référence de session.</p><button class="btn ${state.arsenal?'':'alt'}" data-print="arsenal" ${!state.arsenal?'disabled':''}>Réimprimer Arsenal</button></div></div><div class="notice">Le PDF est enregistré par le navigateur, pas par un serveur. Pour le transfert au formateur, conserve le fichier sur ton appareil puis remets-le selon la consigne donnée en cours.</div>`}
function reportMarkup(kind){const pf=state.profile;let id=`${esc(pf.name)} ${esc(pf.first)} · ${esc(pf.team)} · ${esc(pf.session)}`;let intro=`<h1>BLACKOUT INDUSTRY — ${kind==='exam'?'BLACKOUT FINAL':kind==='missions'?'BILAN DES MISSIONS':'ARSENAL FLASH'}</h1><p><b>Apprenti :</b> ${id}<br><b>Version :</b> V0.1 · <b>Date :</b> ${new Date(kind==='arsenal'&&state.arsenal?state.arsenal.date:Date.now()).toLocaleString('fr-FR')}</p>`;if(kind==='missions')return intro+`<h2>Scores : ${fmt(earned())} CE historiques</h2><table><thead><tr><th>Mission</th><th>Crédits</th><th>Réussite</th><th>Temps</th></tr></thead><tbody>${missions.map(m=>{let r=state.missionResults[m.id];return `<tr><td>${esc(m.name)}</td><td>${r?fmt(r.score):'—'}</td><td>${r?r.correct+'/'+r.total:'—'}</td><td>${r?fmt(r.minutes)+' min':'—'}</td></tr>`}).join('')}</tbody></table>`+missions.filter(m=>state.missionResults[m.id]).map(m=>`<h2>${esc(m.name)}</h2><table><thead><tr><th>Question</th><th>Réponse</th><th>Statut</th><th>Explication</th></tr></thead><tbody>${state.missionResults[m.id].details.map(d=>`<tr><td>${esc(d.id)} ${esc(d.title)}</td><td>${esc(d.given)}</td><td>${d.ok?'Juste':'À revoir'}</td><td>${esc(d.ex)}</td></tr>`).join('')}</tbody></table>`).join('');if(kind==='exam'){let r=scoreExam();return intro+`<h2>Note : ${fmt(r.score)} / 20</h2><p>Épreuve de 75 minutes · Durée enregistrée : ${fmt(Math.min(75,(state.exam.completedAt-state.exam.startedAt)/60000))} minutes</p><table><thead><tr><th>Réf.</th><th>Réponse</th><th>Points</th><th>Indices</th><th>Corrigé expliqué</th></tr></thead><tbody>${r.parts.map(x=>`<tr><td>${esc(x.q.id)}</td><td>${esc(x.given===undefined?'Non répondu':x.q.type==='choice'?x.q.options[Number(x.given)]:x.given)}</td><td>${fmt(x.pt)}/1</td><td>${x.h}</td><td>${esc(x.q.ex)}</td></tr>`).join('')}</tbody></table>`}let ar=state.arsenal;if(!ar)return intro+'<p>Aucun Arsenal figé.</p>';return intro+`<p><b>Identifiant Arsenal :</b> ${esc(ar.id)}<br><b>Figé le :</b> ${new Date(ar.date).toLocaleString('fr-FR')}<br><b>Questions :</b> ${ar.questions.length} · <b>CE dépensés :</b> ${ar.questions.length*100}</p><p>Document de composition des sujets adverses. <b>Aucune réponse ni correction incluse.</b></p>`+ar.questions.map((q,i)=>`<div class="print-q"><b>${i+1}. ${esc(q.id)} — ${esc(q.title)}</b> (${esc(q.domain)})<p>${esc(q.prompt)}</p>${q.options.map((o,j)=>`<p style="margin:4px 0">☐ ${'ABCD'[j]}. ${esc(o)}</p>`).join('')}<p><b>Justification (si demandée) :</b></p><div class="print-space"></div></div>`).join('')}
function printReport(kind){if(kind==='exam'&&!state.exam.complete)return toast('L’épreuve n’est pas clôturée.');if(kind==='arsenal'&&!state.arsenal)return toast('Fige d’abord ton Arsenal.');$('report-print').innerHTML=reportMarkup(kind);document.title=`BLACKOUT_${kind}_${state.profile.name||'APPRENTI'}_V01`;window.print();setTimeout(()=>document.title='BLACKOUT INDUSTRY — NEXUS',1000)}
function freezeArsenal(){if(state.arsenal)return printReport('arsenal');if(!state.shopBought.length)return toast('Achète au moins une question.');if(!state.profile.name.trim()||!state.profile.first.trim()||!state.profile.team.trim())return toast('Renseigne nom, prénom et équipe dans Mes bilans avant de figer.');if(!confirm('Figer définitivement les '+state.shopBought.length+' question(s) achetée(s) ? Aucun autre achat ne sera possible dans cette session.'))return;state.arsenal={id:'ARS-'+state.profile.session+'-'+String(Date.now()).slice(-9),date:Date.now(),profile:{...state.profile},questions:state.shopBought.map(id=>{let q=shop.find(x=>x.id===id);return {...q}})};save();render();printReport('arsenal')}
function startExam(){if(!confirm('Démarrer le chronomètre de 75 minutes ? Il continuera même si la page est actualisée.'))return;state.exam={startedAt:Date.now(),stage:0,answers:{},hints:{},complete:false,completedAt:null};save();render()}
function examSubmit(){let e=state.exam,n=exam[e.stage].questions.filter(q=>e.answers[q.id]===undefined||e.answers[q.id]==='').length;if(!confirm(`Valider définitivement cette étude ? ${n} réponse(s) vide(s). Tu ne pourras plus revenir dessus.`))return;e.stage++;if(e.stage>=exam.length)finalizeExam();save();render();window.scrollTo(0,0)}
function render(){nav();$('credits').textContent=fmt(balance());let s=state.screen;let el=$('main');if(s==='home')el.innerHTML=home();else if(/^m[1-7]$/.test(s))el.innerHTML=mission(Number(s.slice(1)));else if(s==='exam')el.innerHTML=renderExam();else if(s==='shop')el.innerHTML=shopPage();else if(s==='reports')el.innerHTML=reports();else{state.screen='home';el.innerHTML=home()}wire();}
function wire(){document.querySelectorAll('#main [data-nav]').forEach(x=>x.onclick=()=>goto(x.dataset.nav));document.querySelectorAll('[data-do="continue"]').forEach(x=>x.onclick=()=>goto(passed()===7?'exam':'m'+(passed()+1)));document.querySelectorAll('[data-mission-step]').forEach(b=>b.onclick=()=>{let id=Number(state.screen.slice(1));ensureDraft(id).step=b.dataset.missionStep;save();render()});let id=/^m[1-7]$/.test(state.screen)?Number(state.screen.slice(1)):null;const d=id?ensureDraft(id):null;
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{d.answers[b.dataset.pick]=Number(b.dataset.choice);save();render()});document.querySelectorAll('[data-input]').forEach(input=>input.oninput=()=>{d.answers[input.dataset.input]=input.value;save();let b=document.querySelector('[data-challenge-next], [data-train-check]');if(b)b.disabled=!input.value.trim()});document.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{let k=b.dataset.hint;d.hints[k]=Math.min(2,(d.hints[k]||0)+1);save();render()});let t=document.querySelector('[data-train-check]');if(t)t.onclick=()=>{let m=missions[id-1],q=m.training[d.training];d.answers['done-T'+q.id]=true;save();render()};t=document.querySelector('[data-train-next]');if(t)t.onclick=()=>{d.training++;d.step=d.training>=missions[id-1].training.length?'challenge':'training';save();render()};t=document.querySelector('[data-challenge-next]');if(t)t.onclick=()=>{d.ch++;if(d.ch>=missions[id-1].challenges.length)finalizeMission(id);save();render();window.scrollTo(0,0)};
t=document.querySelector('[data-exam-start]');if(t)t.onclick=startExam;document.querySelectorAll('[data-exam-choice]').forEach(b=>b.onclick=()=>{state.exam.answers[b.dataset.examChoice]=Number(b.dataset.value);save();render()});document.querySelectorAll('[data-exam-number]').forEach(input=>input.oninput=()=>{state.exam.answers[input.dataset.examNumber]=input.value;save()});document.querySelectorAll('[data-exam-hint]').forEach(b=>b.onclick=()=>{let k=b.dataset.examHint;state.exam.hints[k]=Math.min(2,(state.exam.hints[k]||0)+1);save();render()});t=document.querySelector('[data-exam-submit]');if(t)t.onclick=examSubmit;
for(const id of ['shop-domain','shop-difficulty']){t=$(id);if(t)t.onchange=shopFilter}if(state.screen==='shop')shopFilter();document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let q=b.dataset.buy;if(state.arsenal||state.shopBought.includes(q)||balance()<100)return;if(!confirm('Acheter la question '+q+' pour 100 CE ?'))return;state.shopBought.push(q);save();render();toast('Question '+q+' ajoutée à ton Arsenal.')});t=document.querySelector('[data-freeze]');if(t)t.onclick=freezeArsenal;document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printReport(b.dataset.print));t=document.querySelector('[data-save-profile]');if(t)t.onclick=()=>{for(let k of ['name','first','team','session'])state.profile[k]=($('profile-'+k)?.value||'').trim();save();toast('Identité enregistrée.');render()};}
$('brand').onclick=e=>{e.preventDefault();goto('home')};
setInterval(()=>{let e=state.exam;if(!e.startedAt||e.complete)return;let rem=examRemaining();if(rem<=0){finalizeExam();if(state.screen==='exam')render();else toast('Épreuve clôturée : 75 minutes écoulées.');return}if(rem===900||rem===300)toast(`Il reste ${rem/60} minutes pour terminer l’épreuve.`);let c=$('countdown');if(c){c.textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');c.classList.toggle('urgent',rem<=300)}},1000);
// Fix snapshots across profile edits: once frozen, the Arsenal always prints its original identity.
const oldPrint=printReport;printReport=function(kind){if(kind==='arsenal'&&state.arsenal){let saved=state.profile;state.profile=state.arsenal.profile;oldPrint(kind);state.profile=saved;return}oldPrint(kind)};
render();
</script></body></html>
