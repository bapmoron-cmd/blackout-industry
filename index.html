ze:34px}.speaker img{width:90px}.speaker .line{padding:10px 11px 10px 0}.stat{padding:12px}.question{padding:16px}.report-table{font-size:11px}.footer{font-size:10px;padding:12px}}@media print{body{background:white!important;color:#111!important}body *{visibility:hidden!important}.shell,#toast{display:none!important}#report-print,#report-print *{visibility:visible!important}#report-print{display:block!important;position:absolute;left:0;top:0;width:100%;font:11pt Arial,sans-serif;color:black;padding:0 12mm}#report-print h1{color:black;font-size:20pt}#report-print h2{font-size:13pt;border-bottom:1px solid #ccc;padding-bottom:4px;margin-top:20px}#report-print table{border-collapse:collapse;width:100%;font-size:9pt}#report-print td,#report-print th{padding:5px;border:1px solid #bbb;text-align:left;vertical-align:top}#report-print .no-print{display:none!important}#report-print .print-q{page-break-inside:avoid;margin:12px 0;padding:7px;border:1px solid #bbb}#report-print .print-space{height:54px;border-bottom:1px dotted #999}} 

/* V0.2 : documents techniques et entraînements de réserve */
.technical{padding:20px;margin:18px 0;border:1px solid var(--border);border-radius:14px;background:rgba(100,180,220,.055)}.technical svg{display:block;width:100%;max-height:240px;margin:12px auto}.tech-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tech-panels>div{padding:10px;border:1px solid var(--border);border-radius:10px}.tech-flow{display:flex;flex-direction:column;gap:8px;align-items:center}.tech-flow>span,.tech-flow>strong{padding:8px 16px;border:1px solid var(--border);border-radius:9px;text-align:center;min-width:215px;position:relative}.tech-flow>strong:not(:last-child):after{content:"↓";position:absolute;bottom:-19px;left:calc(50% - 5px);font-size:16px;color:#8bc7ef}.tech-flow small{font-size:11px;font-weight:400;display:block}.technical p{font-size:13px}@media(max-width:620px){.tech-panels{grid-template-columns:1fr}.technical{padding:12px}}

/* V0.5 — documents de travail, dossiers techniques et jetons d'indice */
.case-brief{border:1px solid #416483;background:linear-gradient(145deg,#13263b,#0e1929);border-radius:16px;padding:23px;margin:18px 0;line-height:1.75}
.case-brief h3,.case-doc h3{margin:0 0 12px;color:#e3faff}
.case-brief ul{margin:8px 0 5px;padding-left:22px}.case-brief li{margin-bottom:5px}
.case-doc{background:#0b1728;border:1px solid #416483;border-radius:16px;padding:16px;margin:18px 0;overflow:hidden}
.case-doc svg{display:block;width:100%;height:auto;max-height:550px;background:#f8fafc;border-radius:9px;margin:10px auto}
.case-doc.zoomed{position:fixed;inset:3vh 3vw;z-index:100;overflow:auto;background:#091726;box-shadow:0 0 0 120vw rgba(0,0,0,.85);padding:24px}.case-doc.zoomed svg{height:auto;max-height:none;min-width:680px}.case-doc .doc-caption{font-size:12px;line-height:1.6;color:#bacde4}
.case-doc .doc-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
.case-doc .doc-table th,.case-doc .doc-table td{padding:9px;text-align:left;border:1px solid #37516b}
.case-doc .doc-table th{background:#22354b}
.case-questions{border-left:3px solid #30e3e6;padding-left:14px;margin:12px 0;color:#d6e7fb;font-size:13px;line-height:1.7}
.method-area{display:block;width:100%;min-height:125px;padding:14px;border:1px solid #53728f;background:#0d192a;border-radius:12px;color:#eff6ff;resize:vertical;line-height:1.6;font:inherit;margin:11px 0}
.method-area:focus{outline:2px solid #30e3e6;outline-offset:1px}
.hint-wallet{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#172a3c;border:1px solid #477491;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px}
.hint-wallet strong{color:#ffc44b}
.micro-course{display:grid;gap:13px;margin:17px 0}.course-unit{padding:16px;background:#142437;border:1px solid #324b63;border-radius:13px;line-height:1.7}.course-unit h4{margin:0 0 8px;color:#30e3e6;font-size:16px}.course-unit p{margin:5px 0}.course-unit .formula{padding:8px 13px;border-left:3px solid #ffc44b;background:#0a1727;font-family:Consolas,monospace;overflow-wrap:anywhere}
.bonus-summary{background:#17352f;border:1px solid #30745e;padding:14px;border-radius:12px;margin:14px 0;color:#d8fff3}

const missions=[
{id:1,name:'Réveil électrique',duration:25,desc:'Réparer l’alimentation de commande 24 V.',topic:'Loi d’Ohm et puissance',lesson:'Tension U (V), courant I (A), résistance R (Ω) : U = R × I. Puissance en continu : P = U × I. Le voltmètre se branche aux bornes du récepteur.',training:[Q('M1-01','Quelle unité correspond à la résistance ?','Associe la grandeur R à son unité.',['Volt','Ohm','Ampère','Watt'],1,'La résistance est notée R.','Son unité utilise la lettre grecque Ω.','R se mesure en ohms.'),N('M1-03','Courant de référence','Sous 24 V, une résistance de 48 Ω absorbe combien d’ampères ?',.5,'I = U/R.','24 ÷ 48','I = 24/48 = 0,5 A.')],challenges:[N('M1-05','Réparer le circuit','24 V sur 60 Ω : calculer I en ampères.',.4,'Loi d’Ohm.','I = U/R.','24/60 = 0,40 A.'),N('M1-06','Résistance fantôme','24 V et 0,30 A : calculer R en ohms.',80,'Isoler R.','R = U/I.','24/0,30 = 80 Ω.'),N('M1-07','Sous-tension','Une résistance fixe de 48 Ω reçoit seulement 12 V : calculer I en ampères.',.25,'Recalculer à la tension mesurée.','I = 12/48.','Le courant vaut 0,25 A ; la cause de la sous-tension reste à investiguer.')]},
{id:2,name:'Guerre des puissances',duration:35,desc:'Rétablir le bilan énergétique.',topic:'P, Q, S et cos φ',lesson:'Régime triphasé équilibré sinusoïdal : S = √3 UI ; P = √3 UI cosφ ; Q = √3 UI sinφ. Pour plusieurs charges, additionner P et Q séparément, puis S total = √(P²+Q²).',training:[Q('M2-01','La puissance apparente','Quelle est son unité ?',['W','VA','var','V'],1,'La lettre est S.','Voltampère.','S en VA, P en W, Q en var.'),N('M2-03','Triangle des puissances','P = 800 W et Q = 600 var : déterminer S en VA.',1000,'Pythagore.','√(800²+600²).','S = 1000 VA.')],challenges:[N('M2-05','Récepteur monophasé','230 V × 6 A : calculer S en VA.',1380,'En monophasé : S = UI.','230 × 6.','S = 1380 VA.'),N('M2-06','Moteur triphasé','Réseau 400 V, I = 14 A, cosφ = 0,85 : calculer P en kW.',8.244,'Utilise la relation triphasée.','P = √3 × 400 × 14 × 0,85 / 1000.','P ≈ 8,244 kW.'),N('M2-07','Bilan de charges','P total = 6 kW et Q total = 2 kvar : calculer S total en kVA.',6.3249,'S n’est pas P + Q.','√(6²+2²).','S ≈ 6,325 kVA.'),N('M2-08','Le courant introuvable','P = 9 kW, U = 400 V, cosφ = 0,90 : calculer I de ligne en A.',14.4338,'Isoler I.','I = 9000/(√3×400×0,9).','I ≈ 14,43 A.')]},
{id:3,name:'Chaos triphasé',duration:30,desc:'Retrouver les bons couplages moteurs.',topic:'Étoile, triangle et tensions',lesson:'En étoile Y, chaque enroulement reçoit la tension composée / √3. En triangle Δ, chaque enroulement reçoit la tension composée. Plaque 230/400 Δ/Y : Y sous 400 V ; plaque 400/690 Δ/Y : Δ sous 400 V.',training:[Q('M3-01','Tension simple','Dans un réseau 230/400 V, la tension phase-neutre vaut :',['400 V','690 V','230 V','24 V'],2,'Entre phase et neutre.','La petite valeur.','230 V.'),Q('M3-03','Choisir le couplage','Moteur 230/400 V Δ/Y sur réseau 400 V entre phases :',['Triangle','Étoile','Aucun','Les deux'],1,'L’enroulement nominal est prévu pour 230 V.','En Y, 400/√3 ≈ 230 V.','Couplage étoile.')],challenges:[Q('M3-05','Convoyeur M1','Plaque 400/690 V Δ/Y, réseau 400 V : couplage nominal ?',['Étoile','Triangle','Sans barrettes','Impossible'],1,'Comparer la plus petite tension de plaque.','400 V correspond à Δ.','Triangle, 400 V à chaque enroulement.'),N('M3-06','Tension des enroulements','Moteur en étoile sur réseau 400 V : tension d’enroulement en V ?',230.94,'En étoile, diviser par √3.','400/√3.','Environ 231 V.'),Q('M3-07','Couplage incorrect','230/400 Δ/Y branché Δ sur 400 V : que reçoit chaque enroulement ?',['230 V','400 V','0 V','690 V'],1,'En triangle la tension des enroulements = U composée.','400 V et non 230 V.','400 V sur un enroulement prévu pour 230 V : couplage inadapté.')]},
{id:4,name:'Moteur en surchauffe',duration:40,desc:'Analyser les vitesses et le glissement.',topic:'Moteur asynchrone',lesson:'Un moteur asynchrone triphasé à cage comporte stator fixe et rotor mobile. n synchronisme = 120 f / nombre total de pôles. Glissement en % = (ns − n)/ns × 100. Le glissement seul ne prouve pas la cause d’une panne.',training:[Q('M4-01','Le stator','Quelle partie reste fixe ?',['Rotor','Stator','Arbre','Ventilateur'],1,'Le nom est stator.','Il porte les enroulements statoriques.','Stator fixe.'),N('M4-03','Vitesse du champ','4 pôles sous 50 Hz : ns en tr/min ?',1500,'ns = 120 f / p.','120 × 50 / 4.','1500 tr/min.')],challenges:[N('M4-05','Le moteur à 60 Hz','Moteur 4 pôles à 60 Hz : ns en tr/min ?',1800,'Utilise la fréquence de 60 Hz.','120 × 60 / 4.','1800 tr/min.'),N('M4-06','Le moteur ralentit','ns = 1500 tr/min, n = 1380 tr/min : glissement en % ?',8,'Différence relative.','(1500−1380)/1500×100.','8 %. On ne peut pas affirmer la cause.'),N('M4-07','Champ tournant saboté','4 pôles, fréquence 40 Hz : ns en tr/min ?',1200,'Fréquence modifiée.','120 × 40 / 4.','1200 tr/min.'),N('M4-08','BOSS convoyeur','ns = 1500 tr/min, n = 1410 tr/min : glissement en % ?',6,'Différence des vitesses.','90 / 1500 × 100.','6 % ; vérifier charge, alimentation et ventilation sans conclure prématurément.')]},
{id:5,name:'Rendement critique',duration:45,desc:'Reconstituer le bilan énergétique du moteur.',topic:'Rendement et pertes',lesson:'P absorbée = puissance électrique active prise au réseau ; P utile = puissance mécanique à l’arbre. η = P utile / P absorbée. P pertes = P absorbée − P utile. Pour un moteur réel : η ≤ 1.',training:[Q('M5-01','Puissance nominale','Une plaque moteur indique 5,5 kW : généralement il s’agit de :',['P absorbée','P utile mécanique','P réactive','P apparente'],1,'C’est la puissance de sortie de l’arbre.','Puissance mécanique utile.','La plaque donne généralement la puissance mécanique utile nominale.'),N('M5-03','Rendement express','P utile = 2000 W, P absorbée = 2500 W : rendement en % ?',80,'η = Pu/Pa.','2000/2500×100.','80 %.')],challenges:[N('M5-05','Moteur gourmand','P absorbée = 8 kW, P utile = 6,8 kW : η en % ?',85,'Rapport sortie/entrée.','6,8/8×100.','85 %.'),N('M5-06','Plaque convoyeur','P utile = 5,5 kW, η = 88 % : P absorbée en kW ?',6.25,'Divise par le rendement en décimal.','5,5 / 0,88.','6,25 kW.'),N('M5-07','Triphasé et rendement','400 V, 10 A, cosφ 0,8, η 85 % : P utile en kW ?',4.711,'Calcule d’abord P absorbée.','0,85×√3×400×10×0,8/1000.','4,711 kW.'),N('M5-08','Choix moteur','Pu utile 7,5 kW ; η A=85 %, η B=92 %. Économie de puissance active B vs A en kW ?',0.6714,'Comparer Pu/η pour chacun.','7,5/0,85 − 7,5/0,92.','Environ 0,671 kW d’économie de puissance active.')]},
{id:6,name:'Armoire sous contrôle',duration:45,desc:'Vérifier composants, protections et réglages.',topic:'Contacteur et relais thermique',lesson:'Q1 protège ici des courts-circuits, KM1 est le contacteur, F1 un relais thermique en ligne, M1 le moteur. Un relais thermique contre surcharge ne remplace pas la protection court-circuit. Réglage initial de référence : In plaque, selon notice constructeur.',training:[Q('M6-01','Appareil de manœuvre','Quel appareil établit et coupe le circuit de puissance sur ordre électrique ?',['Sectionneur simple','Contacteur','Relais thermique','Moteur'],1,'Il possède une bobine A1-A2.','KM1.','Le contacteur.'),Q('M6-03','Relais thermique','Contre quoi protège-t-il principalement ?',['Court-circuit seulement','Surcharge prolongée','Surtension réseau','Défaut logiciel'],1,'L’échauffement lié à l’excès de courant.','Surcharge prolongée.','Le relais thermique sert à protéger contre les surcharges.')],challenges:[Q('M6-05','Fonctions Q1','Dans ce départ, Q1 est le disjoncteur magnétique. Quelle fonction assure-t-il ?',['Commande Marche','Protection court-circuit','Mesure du rendement','Couplage étoile'],1,'Protection en amont.','Court-circuit.','Q1 traite les courts-circuits dans ce montage.'),N('M6-06','Réglage thermique','Moteur In 11 A, relais thermique en ligne 9–13 A : réglage initial de référence en A ?',11,'Réglage lié au courant plaque.','11 A sous réserve de notice.','11 A ; réglage 13 A excessif pour la référence choisie.'),Q('M6-07','Choisir le relais','Quelle plage convient à un réglage initial à 11 A ?',['5,5–8 A','9–13 A','14–18 A','6–10 A'],1,'La plage doit englober 11 A.','9 à 13.','Le relais 9–13 A est une présélection cohérente.'),Q('M6-08','Relevés de courant','Mesures 12,8 A / 13 A / 12,7 A avec In=11 A. Que conclure ?',['Fonctionnement nominal certain','Surintensité constatée ; cause à rechercher','Court-circuit certain','Bobine HS certaine'],1,'Comparer aux 11 A nominaux.','Les trois courants sont supérieurs.','Dépassement nominal, investigations nécessaires sans cause unique.')]},
{id:7,name:'Le schéma de l’Ombre',duration:65,desc:'Résoudre le sabotage de la commande moteur.',topic:'Commande, auto-maintien, diagnostic',lesson:'S0 arrêt NF, S1 marche NO ; F1 95-96 NF ; bobine KM1 A1-A2. Le contact NO KM1 13-14, en parallèle de S1, permet l’auto-maintien. Pour un inverseur, verrouiller KM1/KM2 afin d’empêcher la fermeture simultanée.',training:[Q('M7-01','Contact de Marche','Quel est généralement l’état du bouton Marche au repos ?',['NF','NO','Toujours alimenté','Indéfini'],1,'Il ferme au moment de l’appui.','Normalement ouvert.','S1 est NO au repos.'),Q('M7-04','Sans auto-maintien','Sans contact de maintien, que fait KM1 au relâchement de S1 ?',['Reste collé','Retombe','Inverse le moteur','Disjoncte toujours'],1,'Le bouton NO revient ouvert.','Plus de chemin de courant vers la bobine.','KM1 retombe.')],challenges:[Q('M7-06','Bobine KM1','Quels repères identifient la bobine d’un contacteur standard ?',['95-96','A1-A2','13-14','L1-L2'],1,'Ce sont les bornes de commande de la bobine.','A1 et A2.','A1-A2 désignent la bobine.'),Q('M7-07','Branche de maintien','Où placer le contact auxiliaire NO KM1 13-14 ?',['En parallèle de S1','En parallèle de S0','En série avec M1','En court-circuit de F1'],0,'Le contact remplace temporairement Marche après relâchement.','En parallèle de S1.','Le contact auxiliaire assure l’auto-maintien sans contourner l’arrêt.'),Q('M7-08','Inverseur','À quoi sert l’interverrouillage KM1/KM2 ?',['Accélérer le moteur','Empêcher simultanéité','Augmenter cosφ','Mesurer le courant'],1,'Les deux sens ne doivent pas se fermer ensemble.','Éviter un court-circuit entre phases.','Un verrouillage électrique et mécanique approprié évite la fermeture simultanée.'),Q('M7-09','BOSS : maintenu, puis retombé','Sous 24 V, KM1 colle seulement tant que S1 est appuyé. Priorité de vérification ?',['Rotor brisé certain','Branche KM1 13-14 / liaisons','Fréquence nulle certaine','Fusible puissance forcément fondu'],1,'Bobine fonctionne sous appui.','Contrôler le chemin de maintien.','Hypothèse plausible : contact auxiliaire ou liaison du maintien défectueux.')]}
];
const exam=[
{title:'E1 — Fondamentaux 24 V',time:10,context:'Alimentation 24 V continu, charge résistive fixe 48 Ω. Un état anormal donne seulement 12 V aux bornes de la charge.',questions:[N('E1.1','Courant nominal','I sous 24 V, en A ?',.5,'I = U/R.','24/48.','0,50 A.'),N('E1.2','Puissance nominale','P sous 24 V, en W ?',12,'P = UI.','24×0,5.','12 W.'),N('E1.3','Sous-tension','I lorsque U charge = 12 V, en A ?',.25,'R supposée constante.','12/48.','0,25 A ; l’origine de la panne reste inconnue.')]},

function header(k,h,p=''){return `<div class="page-head"><div class="kicker">${esc(k)}</div><h1>${esc(h)}</h1><p>${esc(p)}</p></div>`}
function home(){let complete=passed();return `<section class="hero"><div><div class="eyebrow">ϟ OPÉRATION NEXUS INDUSTRIES</div><h1>REPRENEZ LE <span>CONTRÔLE.</span></h1><p>7 secteurs sabotés. Un robot pour t'aider. Une ombre qui veut te voir échouer. Rétablis l'usine et prépare ton BLACKOUT FINAL.</p><div class="actions"><button class="btn" data-do="continue">${complete===7?'Voir le BLACKOUT FINAL':'Poursuivre la campagne'} →</button><button class="btn alt" data-nav="reports">Mes résultats</button></div></div></section><div class="stats"><div class="stat"><div class="label">MISSIONS TERMINÉES</div><strong>${complete}/7</strong><div class="progress"><div style="width:${100*complete/7}%"></div></div></div><div class="stat"><div class="label">CRÉDITS GAGNÉS</div><strong>${fmt(earned())}</strong><div class="mini">maximum 7 000 CE</div></div><div class="stat"><div class="label">ÉPREUVE FINALE</div><strong>${state.exam.complete?fmt(scoreExam().score)+'/20':'75 min'}</strong><div class="mini">5 études · 20 questions</div></div><div class="stat"><div class="label">BOUTIQUE</div><strong>${state.shopBought.length}/50</strong><div class="mini">questions achetées</div></div></div><div class="section-heading"><h2>Carte des secteurs</h2><span class="tag">Débloqués dans l'ordre</span></div><div class="mission-grid">${missions.map(m=>`<div class="mission-card ${!isUnlocked(m.id)?'disabled':''}"><div class="topline"><span class="kicker">MISSION ${String(m.id).padStart(2,'0')}</span><span class="pill ${state.missionResults[m.id]?'done':''}">${state.missionResults[m.id]?'RÉTABLIE':isUnlocked(m.id)?'DISPONIBLE':'VERROUILLÉE'}</span></div><h3>${esc(m.name)}</h3><p>${esc(m.desc)}</p><div class="tag">◷ ${m.duration} min · jusqu’à 1 000 CE ${state.missionResults[m.id]?'· '+fmt(state.missionResults[m.id].score)+' CE':''}</div><div class="actions"><button class="btn ${isUnlocked(m.id)?'alt':'flat'}" ${!isUnlocked(m.id)?'disabled':''} data-nav="m${m.id}">${state.missionResults[m.id]?'Consulter':'Entrer dans la mission'}</button></div></div>`).join('')}</div><div class="notice">Version V0.6 : 105 activités disponibles, dont 49 questions supplémentaires permettant de gagner des jetons d’indice. Schémas pédagogiques simplifiés ; les documents fabricants et la sécurité des corrigés restent à compléter. Les notes sont stockées uniquement sur cet appareil.</div>`+replayPanel()}
function ensureDraft(id){if(!state.missionDraft[id])state.missionDraft[id]={step:'intro',training:0,ch:0,answers:{},hints:{},startedAt:Date.now(),result:null};return state.missionDraft[id]}
function questionHTML(q,prefix,allowHints=true){let key=prefix+q.id,selected=state.missionDraftCurrent?.answers?.[key];return `<div class="question"><span class="number">${esc(q.id)}</span><h3>${esc(q.t)}</h3><p>${maths(q.p)}</p>${q.type==='choice'?`<div class="opts">${q.options.map((o,i)=>`<button class="opt ${String(selected)===String(i)?'selected':''}" data-pick="${attr(key)}" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(o)}</button>`).join('')}</div>`:`<label class="field" for="val-${attr(q.id)}">Réponse numérique (unités indiquées dans la question)</label><input id="val-${attr(q.id)}" class="answer-input" inputmode="decimal" type="text" value="${attr(selected??'')}" data-input="${attr(key)}" placeholder="Saisir un nombre (ex. 6,25)">`}${allowHints?`<div class="actions"><button class="btn flat" data-hint="${attr(key)}" ${((state.missionDraftCurrent?.hints?.[key])||0)>=2?'disabled':''}>💡 Indice ${(state.missionDraftCurrent?.hints?.[key]||0)+1}/2</button></div>${state.missionDraftCurrent?.hints?.[key]?`<div class="hintbox">${maths(q.h1)}${state.missionDraftCurrent.hints[key]>1?' — '+maths(q.h2):''}</div>`:''}`:''}</div>`}
function questionCorrect(q,a){if(a===null||a===undefined||String(a).trim()==='')return false;if(q.type==='choice')return Number(a)===q.a;let x=nval(a);return x!==null&&Math.abs(x-q.a)<=Math.max(.015,Math.abs(q.a)*.012)}
function mission(id){let m=missions.find(x=>x.id===id);if(state.missionResults[id]){let r=state.missionResults[id];return header('Secteur restauré · Mission '+id,m.name,'Tu peux consulter tes résultats, mais les CE de cette mission ne peuvent pas être gagnés une seconde fois.')+`<div class="stats"><div class="stat"><div class="label">CRÉDITS</div><strong>${fmt(r.score)}</strong></div><div class="stat"><div class="label">RÉUSSITE</div><strong>${r.correct}/${r.total}</strong></div><div class="stat"><div class="label">TEMPS</div><strong>${fmt(r.minutes)} min</strong></div></div>${speaker('voltx','Zone restaurée ! Revois les corrections dans ton bilan de mission.')}${r.details.map(d=>`<div class="card"><strong>${esc(d.id)} — ${esc(d.title)}</strong><p class="small muted">Ta réponse : ${esc(d.given)}</p><div class="answer-feedback ${d.ok?'':'bad'}">${maths(d.ex)}</div></div>`).join('')}<div class="actions"><button class="btn" data-do="continue">Continuer →</button><button class="btn alt" data-reserve="${id}">${m.reserve.length} questions supplémentaires · jetons indices →</button><button class="btn alt" data-nav="reports">Voir le bilan</button></div>`}
let d=ensureDraft(id);state.missionDraftCurrent=d;let p=header(`MISSION ${String(id).padStart(2,'0')} · ${m.duration} MIN`,m.name,m.desc);if(teacherMode)p+=`<div class="actions"><button class="btn alt" data-teacher-target="teacher">← Tableau formateur</button></div>`;if(d.step==='intro')return p+speaker('ombre',['','J’ai coupé le 24 V. Les volts vont-ils enfin trouver leur chemin ?','J’ai mélangé les watts, vars et voltampères.','Étoile ou triangle ? Bonne chance avec les barrettes.','Le moteur ralentit… et ton diagnostic aussi ?','Mon moteur à 167 % de rendement est une merveille.','J’ai réglé la protection au maximum. Plus d’ennuis !','J’ai coupé la branche de maintien. Attrape-moi !'][id])+speaker('voltx','Objectif : '+m.desc+' Je t’explique les principes avant l’entraînement. Les défis classés donneront des Crédits Énergie.')+`<div class="panel"><h3>🎯 Objectif de compétence</h3><p class="subtle">${esc(m.topic)}</p><p class="tag">${m.training.length} entraînements guidés • ${m.challenges.length} défis classés • ${m.reserve.length} exercices de réserve • 1 000 CE maximum</p></div><div class="actions"><button class="btn" data-mission-step="lesson">Ouvrir le cours →</button></div>`;
if(d.step==='lesson')return p+`<div class="lesson"><h3>📘 Capsule de cours · VOLT-X</h3><p>${maths(m.lesson)}</p>${technicalDocument(id)}${courseExpanded(id)}<p class="small muted">Lis la capsule, puis applique-la aux situations industrielles proposées. Les réponses aux entraînements seront expliquées après validation.</p></div>`+speaker('voltx','Tu peux revoir ce cours pendant la mission. Comprendre la méthode vaut mieux que deviner la bonne case.')+`<div class="actions"><button class="btn" data-mission-step="training">Démarrer les entraînements →</button><button class="btn alt" data-mission-step="intro">Retour</button></div>`;
if(d.step==='training'){let q=m.training[d.training];if(!q){d.step='challenge';save();return mission(id)}let key='T'+q.id,a=d.answers[key],hasResponse=a!==undefined&&a!=='';let validated=!!d.answers['done-'+key],isOk=questionCorrect(q,a);return p+`<div class="tabs"><span class="pill">ENTRAÎNEMENT ${d.training+1}/${m.training.length}</span><span class="tag">Sans crédits • correction immédiate</span></div><div class="lesson small"><b>Rappel :</b> ${esc(m.lesson)}</div>${questionHTML(q,'T',false)}${validated?`<div class="answer-feedback ${isOk?'':'bad'}">${isOk?'✓ Bonne réponse.':'✕ À revoir.'} ${maths(q.ex)}</div>`:''}<div class="actions">${!validated?`<button class="btn" data-train-check ${!hasResponse?'disabled':''}>Vérifier ma réponse</button>`:`<button class="btn" data-train-next>${d.training+1===m.training.length?'Passer aux défis classés →':'Question suivante →'}</button>`}<button class="btn alt" data-mission-step="lesson">Relire le cours</button></div>`}
if(d.step==='challenge'){let q=m.challenges[d.ch];if(!q){finalizeMission(id);return mission(id)}let key='C'+q.id,a=d.answers[key],hasResponse=a!==undefined&&a!=='';return p+`<div class="exam-head"><span class="pill purple">DÉFI CLASSÉ ${d.ch+1}/${m.challenges.length}</span><span class="tag">⚡ 1 000 CE au total</span></div><div class="progress" style="margin:16px 0"><div style="width:${100*d.ch/m.challenges.length}%"></div></div>${questionHTML(q,'C',true)}<div class="notice">Après validation, cette réponse est verrouillée. La correction complète apparaîtra en fin de mission. Un indice diminue les crédits d’autonomie.</div><div class="actions"><button class="btn" data-challenge-next ${!hasResponse?'disabled':''}>Valider la réponse ${d.ch+1===m.challenges.length?'et terminer':'et continuer →'}</button><button class="btn alt" data-mission-step="lesson">Relire le cours</button></div>`}
return p}
function finalizeMission(id){let m=missions.find(x=>x.id===id),d=ensureDraft(id),n=m.challenges.length,details=m.challenges.map(q=>{let key='C'+q.id,answer=d.answers[key];return {id:q.id,title:q.t,given:answer===undefined?'Non répondu':q.type==='choice'?(q.options[Number(answer)]||'Non répondu'):answer,ok:questionCorrect(q,answer),ex:q.ex,hints:d.hints[key]||0}});let correct=details.filter(x=>x.ok).length,tech=600*correct/n,method=200*correct/n,autonomy=details.reduce((s,x)=>s+(x.hints===0?100/n:x.hints===1?60/n:0),0),minutes=(Date.now()-d.startedAt)/60000,speed=correct/n>=.7?100*Math.max(0,1-Math.max(0,minutes-6)/(m.duration-6)):0;let score=Math.max(0,Math.min(1000,Math.round(tech+method+autonomy+speed)));state.missionResults[id]={score,correct,total:n,minutes:Math.round(minutes*10)/10,details};delete state.missionDraft[id];save();toast('Mission terminée : +'+score+' CE !')}

function technicalDocument(id){
 if(id===3)return `<section class="technical"><h3>Document pédagogique M3 — Bornier moteur six bornes</h3><div class="tech-panels"><div><b>Étoile (Y)</b><svg viewBox="0 0 270 140" role="img" aria-label="Bornier étoile, U2 V2 W2 reliés au point commun"><g fill="none" stroke="#9ed9f7" stroke-width="2"><path d="M48 51H222"/><circle cx="48" cy="51" r="15"/><circle cx="135" cy="51" r="15"/><circle cx="222" cy="51" r="15"/><circle cx="48" cy="107" r="15"/><circle cx="135" cy="107" r="15"/><circle cx="222" cy="107" r="15"/></g><g fill="currentColor" font-size="12" text-anchor="middle"><text x="48" y="26">W2</text><text x="135" y="26">U2</text><text x="222" y="26">V2</text><text x="48" y="111">U1</text><text x="135" y="111">V1</text><text x="222" y="111">W1</text></g></svg><p>Point commun : W2, U2 et V2.</p></div><div><b>Triangle (Δ)</b><svg viewBox="0 0 270 140" role="img" aria-label="Bornier triangle, trois barrettes verticales"><g fill="none" stroke="#9ed9f7" stroke-width="2"><path d="M48 51V107M135 51V107M222 51V107"/><circle cx="48" cy="51" r="15"/><circle cx="135" cy="51" r="15"/><circle cx="222" cy="51" r="15"/><circle cx="48" cy="107" r="15"/><circle cx="135" cy="107" r="15"/><circle cx="222" cy="107" r="15"/></g><g fill="currentColor" font-size="12" text-anchor="middle"><text x="48" y="26">W2</text><text x="135" y="26">U2</text><text x="222" y="26">V2</text><text x="48" y="111">U1</text><text x="135" y="111">V1</text><text x="222" y="111">W1</text></g></svg><p>Barrettes : W2–U1, U2–V1 et V2–W1.</p></div></div><p class="small muted">Représentation de bornier définie par les repères affichés. À confronter à la plaque et au schéma constructeur de la machine réelle.</p></section>`;
 if(id===6)return `<section class="technical"><h3>M6 — Schéma développé du départ moteur triphasé</h3><div class="diagram-expanded">${motorPowerSVG()}</div><p class="small muted">Schéma pédagogique de puissance avec contacts et repères. Le dimensionnement, la coordination et les raccordements réels exigent les notices constructeur.</p></section>`;
 if(id===7)return `<section class="technical"><h3>M7 — Schéma de commande réel issu du cours</h3><div class="diagram-expanded">${motorControlSVG()}</div><p class="small muted">Lire les repères du document : ATU, F2, AT, MA, KM1 et XC. Le montage du cours comporte également deux voyants. Le principe est l'auto-maintien par contact auxiliaire de KM1.</p></section>`;
 return '';
}

// Un jeton gagné par chaque exercice de réserve VALIDÉ, même si sa réponse est fausse.
function earnedHintTokens(){return missions.reduce((n,m)=>n+m.reserve.filter(q=>state.reserveAnswers['done-'+q.id]===true&&questionCorrect(q,state.reserveAnswers[q.id])).length,0)}
function usedHintTokens(){return Object.values((state.exam||{}).hints||{}).reduce((a,b)=>a+Math.min(2,Number(b)||0),0)}
function hintWallet(){return Math.max(0,earnedHintTokens()-usedHintTokens())}
function hintWalletHTML(){return `<div class="hint-wallet"><span>🔐 <b>Jetons d'indice</b></span><span><strong>${hintWallet()}</strong> disponibles</span><span>${earnedHintTokens()} gagnés / ${usedHintTokens()} utilisés</span><span class="small muted">1 bonne réponse = 1 jeton, deux essais maximum.</span></div>`}

const maths=x=>esc(x).replace(/\bsqrt\s*\(/gi,'√(').replace(/\^2\b/g,'²').replace(/\^3\b/g,'³').replace(/\bcosphi\b/gi,'cos φ');
const frac=(a,b)=>'<span class="math-frac"><span class="math-num">'+a+'</span><span class="math-den">'+b+'</span></span>';
function formulaDisplay(id,i,raw){
 const f=frac;
 const catalog={
 1:['U = R × I ; I = '+f('U','R')+' ; R = '+f('U','I'),'U = 24 V ; R = 48 Ω ; I = '+f('24','48')+' = 0,50 A','P = U × I = R × I² = '+f('U²','R'),'Sous 24 V : P = 12 W ; sous 12 V : P = 3 W'],
 2:['S² = P² + Q² ; cos φ = '+f('P','S'),'P = √3 × U × I × cos φ ; S = √3 × U × I','Pₜ = ΣPᵢ ; Qₜ = ΣQᵢ ; Sₜ = √(Pₜ² + Qₜ²)','P = 6 kW ; Q = 8 kvar ; S = 10 kVA'],
 3:['U = √3 × V','Uₑₙᵣ = '+f('U','√3')+' ; Iₗᵢgₙₑ = Iₚₕₐₛₑ','Uₑₙᵣ = U ; Iₗᵢgₙₑ = √3 × Iₚₕₐₛₑ','Réseau 400 V ; moteur 400/690 V Δ/Y ⇒ triangle Δ'],
 4:['','nₛ = '+f('120 × f','Nₚ')+' (tr/min)','g = '+f('nₛ − n','nₛ')+' × 100 (%)','nₛ = 1500 tr/min ; n = 1460 tr/min ⇒ g ≈ 2,67 %'],
 5:['Pₐᵦₛ = Pᵤ + Pₚₑᵣₜₑₛ','η = '+f('Pᵤ','Pₐᵦₛ')+' ; Pᵤ = η × Pₐᵦₛ','','Pₐᵦₛ = '+f('5,5','0,88')+' = 6,25 kW ; pertes = 0,75 kW'],
 6:['','','','Iₙ = 11 A ; plage : 9–13 A ; référence ≈ 11 A']
 };
 return '<div class="math-display" role="math" aria-label="'+attr(raw)+'">'+(catalog[id]?.[i]||maths(raw))+'</div>';
}

function courseExpanded(id){
 const blocks={
  1:[['Mesurer sans confondre','La tension est la différence de potentiel entre deux points ; elle se mesure en parallèle. Le courant traverse un élément et se mesure avec un appareil adapté en série ou une pince appropriée.','U = R × I ; I = U / R ; R = U / I'],['Loi d’Ohm et conditions','La loi d’Ohm décrit un conducteur ohmique à température et caractéristiques constantes. Dans la réalité, la résistance des composants peut changer avec la température.','Exemple : U=24 V et R=48 Ω ⇒ I=0,5 A'],['Évaluer la puissance','En continu sur une charge résistive, la puissance électrique vaut P=U×I. Une baisse de tension fait diminuer la puissance selon P=U²/R lorsque R est constante.','P=U×I=R×I²=U²/R'],['Mener un diagnostic','Séparer la mesure du constat : 12 V aux bornes d’une charge nominalement à 24 V est une sous-tension, pas la preuve d’un câble coupé. Comparer les mesures aux caractéristiques nominales.','24 V/48 Ω : P=12 W ; 12 V/48 Ω : P=3 W']],
  2:[['Les trois puissances','P mesure l’énergie active convertie, Q traduit les échanges réactifs et S correspond à l’apparente. En régime sinusoïdal, leurs unités sont W, var et VA.','S²=P²+Q² ; cosφ=P/S'],['Mesures triphasées','Dans un réseau triphasé équilibré sinusoïdal, la tension U est composée (entre phases) et I désigne le courant de ligne.','P=√3×U×I×cosφ ; S=√3×U×I'],['Bilan d’installation','Pour plusieurs charges, additionner les P et les Q avec leurs signes respectifs avant de reconstituer S. Une compensation capacitive porte un Q négatif dans notre convention.','Pₜ=ΣPᵢ ; Qₜ=ΣQᵢ ; Sₜ=√(Pₜ²+Qₜ²)'],['Interpréter le cos φ','Un cos φ faible augmente le courant pour une même puissance active et une même tension, toutes choses égales par ailleurs. Il ne décrit pas à lui seul le rendement mécanique.','Exemple : 6 kW et 8 kvar donnent S=10 kVA.']],
  3:[['Tensions réseau','En régime équilibré, la tension composée est la tension entre deux phases ; la simple correspond à phase-neutre.','U=√3×V'],['Couplage étoile','Les extrémités de trois enroulements sont reliées au point commun. Chaque enroulement reçoit la tension composée divisée par √3.','Uₑₙᵣ=U/√3 ; Iligne=Iphase'],['Couplage triangle','Chaque enroulement est branché entre deux phases. Les barrettes relient les extrémités d’enroulements en boucle ; leur disposition dépend du repérage physique du bornier.','Uₑₙᵣ=U ; Iligne=√3×Iphase'],['Décoder la plaque','400/690 V Δ/Y signifie nominalement triangle sous 400 V et étoile sous 690 V. Une erreur de couplage peut sous-alimenter ou suralimenter les enroulements.','Sur 400 V : moteur 400/690 Δ/Y ⇒ triangle.']],
  4:[['Parties constitutives','Le stator est fixe ; ses enroulements triphasés créent un champ tournant. Le rotor à cage reçoit des courants induits sans alimentation directe du rotor.'],['Vitesse synchrone','La fréquence d’alimentation et le nombre total de pôles déterminent la vitesse du champ tournant.','nₛ=120×f/Np, avec Np = nombre total de pôles'],['Glissement nécessaire','En mode moteur normal, le rotor tourne un peu moins vite que le champ. Le glissement est l’écart relatif de vitesse.','g=(nₛ−n)/nₛ×100'],['Observer sans conclure','Un glissement supérieur au nominal peut être compatible avec une charge accrue, mais ne suffit pas à établir une cause. Contrôler la fréquence, la charge, les intensités et la ventilation.','4 pôles, 50 Hz : nₛ=1500 tr/min ; n=1460 ⇒ g≈2,67 %.']],
  5:[['Entrée, sortie, pertes','En régime établi, la puissance électrique active absorbée fournit la puissance mécanique utile et les pertes. Une plaque moteur donne généralement la puissance utile nominale.','Pabs=Pu+Ppertes'],['Rendement','Le rendement exprime le rapport entre sortie utile et entrée active au même point de fonctionnement. Il est inférieur à 100 % pour un moteur réel.','η=Pu/Pabs ; Pu=η×Pabs'],['Origine des pertes','On distingue les pertes Joule, pertes fer, pertes mécaniques et pertes supplémentaires. Elles contribuent notamment à l’échauffement et au bruit.'],['Cohérence des mesures','Il faut disposer de grandeurs correspondant au même régime et éviter d’appliquer automatiquement le rendement nominal à toute charge.','5,5 kW utiles et η=88 % ⇒ Pabs=6,25 kW ; pertes=0,75 kW.']],
  6:[['Appareils et rôles','Le contacteur est un organe de manœuvre, tandis que les appareils de protection détectent les défauts. Le sectionnement n’assure pas forcément la coupure en charge.'],['Départ moteur','Un départ peut utiliser sectionnement, protection court-circuit, contacteur et relais thermique. Les fonctions exactes dépendent des modèles, de la coordination et des conditions de réseau.'],['Relais thermique','Le relais détecte une surcharge selon sa caractéristique et ouvre généralement sa voie de commande via 95-96. Il ne remplace pas à lui seul la protection contre les courts-circuits.'],['Interpréter un réglage','Pour un relais monté en ligne, le réglage initial de référence correspond souvent au courant nominal du moteur, avec vérification de la notice et du montage.','M1 In=11 A ; plage 9–13 A ; référence ≈11 A.']],
  7:[['La puissance et la commande','Les contacts principaux de KM1 établissent le circuit de puissance ; sa bobine A1/A2 appartient à la commande. Repérer les appareils de part et d’autre.'],['NO et NF','Le contact NO est ouvert au repos ; le NF fermé au repos. S0 est l’arrêt NF, S1 la marche NO, F1 95-96 la protection NF.'],['Auto-maintien','Le contact KM1 13-14, NO, est relié en parallèle du bouton Marche. La chaîne d’arrêt et de protection reste commune, en série en amont.'],['Diagnostic sûr','Si le contacteur colle sous appui sur Marche et retombe au relâchement, la branche de maintien est suspecte. Le relevé ne permet pas d’identifier avec certitude le composant défectueux.'],['Inversion de sens','Un inverseur triphasé permute deux phases et interdit la fermeture simultanée des deux contacteurs à l’aide de verrouillages adaptés.']]
 };
 return `<div class="micro-course">${(blocks[id]||[]).map((b,i)=>`<div class="course-unit"><h4>${i+1}. ${esc(b[0])}</h4><p>${maths(b[1])}</p>${b[2]?`<div class="formula">${formulaDisplay(id,i,b[2])}</div>`:''}</div>`).join('')}</div>`
}

const caseDetails=[
 {intro:'Un poste de contrôle 24 V DC commande un petit récepteur résistif. Un incident de baisse de tension a été observé. Tu disposes du schéma, des valeurs nominales et de la mesure anormale. Reconstitue la situation et distingue calcul et diagnostic.',facts:['Alimentation nominale : 24 V DC','R1 : 48 Ω supposée constante','Tension mesurée aux bornes R1 pendant incident : 12 V','Aucune mesure ne permet encore d’identifier la cause de la chute de tension'],tasks:[['Écrire la loi utilisée, remplacer U et R par leurs valeurs, puis expliquer ce que représente le courant nominal.','Contrôle de cohérence : 24 V et 48 Ω ; annoncer le résultat avec l’unité.'],['Montrer les deux méthodes possibles pour calculer P (UI et U²/R) et vérifier qu’elles concordent.','Comparer puissance et énergie ; on te demande une puissance.'],['Calculer la nouvelle intensité et indiquer comment évoluerait la puissance si la résistance était constante.','Proposer ensuite UNE vérification pour rechercher l’origine de la sous-tension sans conclure prématurément.']]},
 {intro:'Deux charges industrielles équilibrées fonctionnent simultanément sur le tableau TGBT-02. Ton rapport doit établir les puissances de la première charge et le bilan d’ensemble, puis expliquer la méthode de totalisation.',facts:['Charge 1 : triphasé équilibré sinusoïdal, U=400 V entre phases, I=10 A, cosφ=0,80 inductif','Charge 2 : P₂=3,00 kW, Q₂=+4,00 kvar','Convention : Q inductif positif ; la charge 2 fonctionne simultanément','Attention : S totale ne s’obtient pas par addition directe des S individuelles'],tasks:[['Partir de la tension composée et du courant de ligne, écrire la formule de P triphasée et justifier le facteur √3.','Faire la conversion W → kW.'],['Retrouver sinφ à partir de cosφ=0,80 et calculer Q₁.','Préciser le signe de Q₁.'],['Présenter un tableau à deux colonnes P et Q pour les deux charges, puis additionner séparément.','Indiquer pourquoi une somme directe des puissances apparentes serait incorrecte.'],['Calculer Q totale en étape intermédiaire, puis la norme de la puissance complexe totale.','Contrôler que S totale ≥ |P totale| et commenter le résultat.']]},
 {intro:'Le moteur asynchrone M1 d’un convoyeur est raccordé à un réseau triphasé 400 V, 50 Hz. La plaque et le bornier à six bornes sont fournis. Tu dois valider le couplage, interpréter la puissance de plaque et mesurer le glissement.',facts:['M1 : 5,5 kW, Δ/Y 400/690 V, ηnom=88 %','Vitesse mécanique nominale : 1460 tr/min','Quatre pôles, f=50 Hz','Les barrettes sont celles du schéma fourni. Ne pas confondre puissance utile et puissance absorbée.'],tasks:[['À partir des deux tensions de plaque, justifier le choix Δ ou Y sous 400 V.','Reporter la tension nominale de chaque enroulement.'],['Distinguer puissance utile, puissance active absorbée et puissance apparente.','Préciser la signification de 5,5 kW sur une plaque industrielle.'],['Poser le bilan énergétique, convertir 88 % en nombre décimal et calculer P absorbée.','Déterminer facultativement les pertes globales et vérifier la cohérence.'],['Calculer d’abord la vitesse synchrone avec le nombre TOTAL de pôles, puis le glissement.','Expliquer pourquoi le rotor ne tourne pas exactement à la vitesse synchrone en mode moteur normal.']]},
 {intro:'Le départ moteur M1 est équipé d’un organe de protection contre les courts-circuits, d’un contacteur et d’un relais thermique en ligne. Des déclenchements et un échauffement sont signalés. Tu dois analyser la chaîne de puissance et les mesures sans déduire une panne certaine.',facts:['M1 : courant nominal de ligne 11 A','F1 : relais thermique monté en ligne, plage de réglage 9 à 13 A','Réglage relevé F1 = 13 A','Courants mesurés : L1 12,8 A ; L2 13,0 A ; L3 12,7 A','Q1 : protection magnétique contre les courts-circuits ; KM1 : contacteur de manœuvre'],tasks:[['Identifier KM1 sur le schéma et préciser quelles parties portent le courant moteur.','Expliquer la différence entre bobine de commande et contacts principaux.'],['Repérer le rôle de F1, son contact auxiliaire de commande et la limite de sa fonction de protection.','Indiquer quel appareil est prévu ici pour le court-circuit.'],['Comparer 13 A et le courant nominal 11 A ; proposer la valeur initiale de référence avec justification.','Ne pas oublier la notice constructeur et le montage en ligne.'],['Comparer chaque courant mesuré à 11 A, puis formuler une anomalie démontrée et deux hypothèses possibles.','Définir une vérification complémentaire pertinente et sûre.']]},
 {intro:'Dans l’armoire de commande 24 V DC, KM1 colle tant que S1 (Marche) est appuyé mais retombe au relâchement. La chaîne d’arrêt et de protection fonctionne. Utilise le schéma développé et les mesures pour distinguer le défaut de maintien des autres causes.',facts:['Commande : +24 V DC et 0 V','S0 NF fermé au repos ; F1 95-96 fermé, relais non déclenché','S1 NO ; KM1 13-14 NO câblé en parallèle de S1','Pendant l’appui sur S1 : bobine 24 V, KM1 collé','Après relâchement : bobine 0 V, KM1 retombe','Une rupture dans la branche de maintien est possible, mais sa localisation n’est pas prouvée'],tasks:[['Indiquer l’état normal du contact S0 et ce qui se produit lorsqu’on appuie sur Arrêt.','Préciser que le circuit d’arrêt reste en série avec le maintien.'],['Tracer mentalement le chemin d’alimentation lorsque KM1 vient de coller.','Expliquer le rôle et l’état du contact NO 13-14 après actionnement.'],['Comparer les deux mesures aux bornes de la bobine et expliquer le symptôme de retombée.','Ne pas confondre tension absente et bobine nécessairement défectueuse.'],['Proposer au moins deux causes compatibles et préciser pourquoi les seules mesures ne permettent pas de les départager.','Repérer le contact et la liaison parallèle à S1.'],['Décrire une démarche documentaire et une vérification par personnel habilité, en sécurité.','Écarter explicitement le shunt des protections et la manipulation improvisée sous tension.']]}
];

const caseInvestigations=[[["Tableau nominal / incident","Construire un tableau comparatif indiquant U, R, I et P pour le régime nominal et la situation à 12 V. Préciser les unités et l'hypothèse de résistance constante.","I nominal 0,50 A et P nominale 12 W ; I incident 0,25 A et P incident 3 W."],["Lecture critique d'une mesure","Expliquer ce que prouve la mesure de 12 V aux bornes de R1 et ce qu'elle ne prouve pas. Proposer deux causes possibles à examiner.","Sous-tension constatée ; origine indéterminée sans mesures de la source et des connexions."],["Plan de diagnostic","Proposer l'ordre de trois contrôles documentaires ou mesures que pourrait effectuer une personne autorisée, en précisant ce que chaque résultat permet de conclure.","Contrôler source, connexion, charge ; ne pas manipuler sous tension sans procédure adaptée."]],[["Tableau P / Q / S","Construire les puissances individuelles des deux récepteurs, puis un bilan total signé de P et Q. Donner les unités des trois types de puissance.","P1 ≈ 5,54 kW, Q1 ≈ 4,16 kvar ; P totale ≈ 8,54 kW, Q totale ≈ 8,16 kvar ; S totale ≈ 11,81 kVA."],["Contrôle d'erreur","Un collègue additionne S1 et S2 pour trouver S totale. Expliquer pourquoi ce raccourci est incorrect dans ce dossier et donner le bon ordre de calcul.","Somme algébrique des P et Q, puis norme sqrt(P²+Q²) ; addition directe de S non valable en général."],["Décision énergétique","Sans fixer de budget, expliquer l'intérêt d'améliorer le facteur de puissance et citer deux données supplémentaires nécessaires avant de choisir une compensation.","Réduction de Q et du courant à P fixé ; profil de charge, Q mesuré, contraintes réseau et équipements."]],[["Contrôle de plaque","Relever U Δ/Y, Pn, rendement, fréquence, vitesse et pôles. Signaler que In est absent du dossier, sans inventer sa valeur.","Puissance 5,5 kW utile, Δ 400 V, rendement 88 %, 4 pôles à 50 Hz, n=1460 tr/min."],["Écart électromécanique","Calculer les pertes nominales, la vitesse de synchronisme et l'écart en tr/min ; expliquer la notion de glissement.","P absorbée 6,25 kW, pertes 0,75 kW ; ns 1500 tr/min, écart 40 tr/min, glissement ≈2,67 %."],["Choix argumenté","Comparer ce qui arriverait aux tensions des enroulements si le moteur 400/690 V était câblé en étoile sur 400 V ; expliquer le risque de sous-alimentation.","Chaque enroulement reçoit ~231 V, inférieur aux 400 V nominaux ; service nominal Δ sur 400 V."]],[["Repérage des trois phases","Relever les organes réellement représentés, leurs fonctions, U1/V1/W1 et PE. Ne pas inventer de sectionneur non représenté.","Sectionnement, court-circuit, contacteur, thermique en ligne ; U1/V1/W1, protection des masses via PE."],["Analyse des relevés","Construire un tableau des écarts de courant par rapport à In=11 A et calculer l'écart moyen. Expliquer ce que montrent et ne montrent pas ces courants.","Écarts +1,8 / +2,0 / +1,7 A ; moyenne ~12,83 A ; surintensité, cause encore inconnue."],["Vérification de protection","Rédiger une fiche d'intervention documentaire : réglage initial de F1, deux hypothèses de surcharge et deux vérifications selon procédure de sécurité.","Réglage initial ~11 A sous réserve constructeur ; examiner charge, ventilation, alimentations, sans shunter protections."]],[["Chronologie des contacts","Établir un tableau à quatre états : repos, S1 appuyé, S1 relâché avec maintien sain, S0 appuyé. Préciser bobine et contact 13-14.","Repos bobine 0, appui bobine 24 V, maintien fermé après relâchement, arrêt bobine 0."],["Localisation argumentée","À partir des mesures 24 V pendant appui et 0 V après relâchement, distinguer une hypothèse de contact 13-14 défaillant et une rupture de liaison ; expliquer comment les départager.","Deux causes compatibles ; contrôles hors tension de continuité et de fonctionnement du contact par personnel habilité."],["Compte rendu maintenance","Rédiger une conclusion avec : symptômes, preuves disponibles, causes probables non confirmées, contrôle recommandé et condition de remise en service.","Éviter le diagnostic catégorique ; proposer contrôle sécurisé et remise en service après validation."]]];
